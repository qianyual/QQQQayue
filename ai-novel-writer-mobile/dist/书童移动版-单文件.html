  async function streamChat(model, messages, opts = {}) {
    if (!model || !model.modelName) throw new Error("请先在「设置」里配置模型");
    /* 先自动清洗三个可能被污染成请求头的字段（多数情况这样就自动修好了） */
    model = Object.assign({}, model, {
      baseUrl: cleanField(model.baseUrl),
      modelName: cleanField(model.modelName),
      apiKey: cleanField(model.apiKey),
    });
    assertHeaderSafe(model);
    const onDelta = opts.onDelta || (() => {});
    let text = "";
    if (model.protocol === "gemini") {
      text = await streamGemini(model, messages, opts, onDelta);
    } else {
      text = await streamOpenAI(model, messages, opts, onDelta);
    }
    return text;
  }

  async function streamOpenAI(model, messages, opts, onDelta) {
    const base = normalizeBaseUrl(model.baseUrl);
    if (!base) throw new Error("该模型缺少 Base URL");
    const url = base + "/chat/completions";
    const body = {
      model: model.modelName,
      messages,
      stream: true,
      temperature: numOr(model.temperature, 0.8),
    };
    const mt = numOr(model.maxTokens, 0);
    if (mt > 0) body.max_tokens = mt;
    const headers = { "Content-Type": "application/json" };
    if (model.apiKey) headers["Authorization"] = "Bearer " + model.apiKey;

    const resp = await fetchWithTimeout(url, {
      method: "POST", headers, body: JSON.stringify(body), signal: opts.signal,
    });
    if (!resp.ok) throw new Error(await readHttpError(resp));
    return consumeSSE(resp, (json) => {
      const d = json.choices && json.choices[0] && json.choices[0].delta;
      return (d && d.content) || "";
    }, onDelta);
  }

  async function streamGemini(model, messages, opts, onDelta) {
    const base = normalizeBaseUrl(model.baseUrl || "https://generativelanguage.googleapis.com");
    const url = `${base}/v1beta/models/${encodeURIComponent(model.modelName)}:streamGenerateContent?alt=sse&key=${encodeURIComponent(model.apiKey || "")}`;
    const sysParts = messages.filter(m => m.role === "system").map(m => ({ text: m.content }));
    const contents = messages.filter(m => m.role !== "system").map(m => ({
      role: m.role === "assistant" ? "model" : "user",
      parts: [{ text: m.content }],
    }));
    const body = {
      contents,
      generationConfig: {
        temperature: numOr(model.temperature, 0.8),
        ...(numOr(model.maxTokens, 0) > 0 ? { maxOutputTokens: numOr(model.maxTokens, 0) } : {}),
      },
    };
    if (sysParts.length) body.systemInstruction = { parts: sysParts };
    const resp = await fetchWithTimeout(url, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body), signal: opts.signal,
    });
    if (!resp.ok) throw new Error(await readHttpError(resp));
    return consumeSSE(resp, (json) => {
      const c = json.candidates && json.candidates[0];
      const parts = c && c.content && c.content.parts;
      return parts ? parts.map(p => p.text || "").join("") : "";
    }, onDelta);
  }

  /* SSE 消费：逐行解析 data: 前缀，[DONE] 结束 */
  async function consumeSSE(resp, pick, onDelta) {
    if (!resp.body || typeof resp.body.getReader !== "function") {
      /* 兜底：环境不支持流式读取（如原生桥接 fetch）时一次性解析全文 */
      return parseSSEText(await resp.text(), pick, onDelta);
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "", full = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, idx).trim();
        buf = buf.slice(idx + 1);
        if (!line.startsWith("data:")) continue;
        const payload = line.slice(5).trim();
        if (payload === "[DONE]") continue;
        let json;
        try { json = JSON.parse(payload); } catch { continue; }
        const piece = pick(json);
        if (piece) { full += piece; onDelta(piece, full); }
      }
    }
    if (!full) throw new Error("模型没有返回内容（检查模型名或余额）");
    return full;
  }

  /* 整段 SSE 文本解析（非流式兜底用） */
  function parseSSEText(text, pick, onDelta) {
    let full = "";
    for (const line of String(text).split("\n")) {
      const l = line.trim();
      if (!l.startsWith("data:")) continue;
      const payload = l.slice(5).trim();
      if (payload === "[DONE]") continue;
      let json;
      try { json = JSON.parse(payload); } catch { continue; }
      const piece = pick(json);
      if (piece) { full += piece; onDelta(piece, full); }
    }
    if (!full) throw new Error("模型没有返回内容（检查模型名或余额）");
    return full;
  }

  async function fetchWithTimeout(url, init) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 180000); // 长文生成给足 3 分钟
    if (init.signal) init.signal.addEventListener("abort", () => ctrl.abort());
    try {
      const resp = await fetch(url, { ...init, signal: ctrl.signal });
      return resp;
    } catch (e) {
      if (e.name === "AbortError") throw e;
      const msg = String((e && e.message) || e);
      if (msg.includes("ISO-8859-1")) {
        throw new Error("请求头里有非法字符：API Key 或模型名中混入了中文/全角符号，请重新粘贴（只需字母数字）");
      }
      if (/Failed to fetch|NetworkError|Load failed|Network request failed/i.test(msg)) {
        throw new Error("网络请求失败：无法连接到服务商（检查网络，或确认该地址允许跨域访问）");
      }
      throw new Error("请求出错：" + msg);
    } finally {
      clearTimeout(t);
    }
  }

  async function readHttpError(resp) {
    let detail = "";
    try { detail = (await resp.text()).slice(0, 300); } catch {}
    const s = resp.status;
    if (s === 401 || s === 403) return `鉴权失败（${s}）：API Key 无效、填错服务商，或该 Key 没有此模型的权限。请重新复制 Key。`;
    if (s === 402) return `余额不足（${s}）：请到服务商后台充值后再试。`;
    if (s === 404) return `接口/模型不存在（404）：检查 Base URL 是否多写或漏写路径，模型名是否写全（DeepSeek 是 deepseek-chat）。`;
    if (s === 400) return `请求被拒绝（400）：常见是模型名写错或参数不支持。${detail}`;
    if (s === 429) return `请求过于频繁或额度用尽（429）：稍等一会儿再试。`;
    if (s >= 500) return `服务商服务器异常（${s}）：稍后重试。`;
    return `请求失败（${s}）${detail}`;
  }

  function numOr(v, d) { const n = Number(v); return isFinite(n) && n > 0 ? n : d; }

  /* ---------- JSON 宽容解析 ---------- */
  function extractJSON(text) {
    let t = text.trim();
    const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/i);
    if (fence) t = fence[1].trim();
    const start = Math.min(...["[", "{"].map(c => { const i = t.indexOf(c); return i < 0 ? Infinity : i; }));
    if (!isFinite(start)) throw new Error("输出中没有找到 JSON");
    t = t.slice(start);
    // 从后往前找闭合
    const endBrackets = { "[": "]", "{": "}" };
    const open = t[0];
    const close = endBrackets[open];
    let depth = 0, end = -1, inStr = false, esc = false;
    for (let i = 0; i < t.length; i++) {
      const ch = t[i];
      if (esc) { esc = false; continue; }
      if (ch === "\\") { esc = true; continue; }
      if (ch === '"') { inStr = !inStr; continue; }
      if (inStr) continue;
      if (ch === open) depth++;
      else if (ch === close) { depth--; if (depth === 0) { end = i; break; } }
    }
    if (end < 0) throw new Error("JSON 不完整");
    return JSON.parse(t.slice(0, end + 1));
  }

  /* ---------- 便捷：一次生成 + JSON 解析（带一次重试） ---------- */
  async function generateJSON(model, messages, opts) {
    try {
      const text = await streamChat(model, messages, opts || {});
      return extractJSON(text);
    } catch (e) {
      // 重试一次，强调裸 JSON
      const retry = [...messages];
      const last = retry[retry.length - 1];
      retry[retry.length - 1] = { role: last.role, content: last.content + "\n\n【注意】上一次输出解析失败，请严格输出裸 JSON，不要任何多余文字或代码块。" };
      const text = await streamChat(model, retry, opts || {});
      return extractJSON(text);
    }
  }

  return { streamChat, generateJSON, extractJSON };
})();

</script>
<script>
/* ============================================================
 * 书童移动版 — 本地持久层
 * 对应桌面版 better-sqlite3 + 项目文件夹；移动端坚持“本地优先”：
 * 首选 IndexedDB；不可用/被禁（无痕模式、受限 WebView、企业策略）时
 * 自动降级到 localStorage。两种模式对外 API 完全一致。
 * ============================================================ */
"use strict";

const DB = (() => {
  const DB_NAME = "anw-mobile";
  const DB_VERSION = 1;
  const LS_NOVELS = "anw-mobile:novels";
  const LS_KV = "anw-mobile:kv";
  let mode = null; // 'idb' | 'ls'
  let dbPromise = null;

  /* ---------- 模式探测：IDB 能打开且能完成一次真实读写才可用，否则降级 localStorage ---------- */
  function detect() {
    if (mode) return Promise.resolve(mode);
    if (typeof indexedDB === "undefined") { mode = "ls"; return Promise.resolve(mode); }
    return new Promise((resolve) => {
      let settled = false;
      const fallback = () => { if (!settled) { settled = true; mode = "ls"; resolve(mode); } };
      const timer = setTimeout(fallback, 2500);
      try {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains("novels")) db.createObjectStore("novels", { keyPath: "id" });
          if (!db.objectStoreNames.contains("kv")) db.createObjectStore("kv");
        };
        req.onsuccess = () => {
          const db = req.result;
          dbPromise = Promise.resolve(db);
          // 真实读写往返：证明事务真的能完成
          try {
            const tx = db.transaction("kv", "readwrite");
            const store = tx.objectStore("kv");
            store.put(1, "__probe__");
            const get = store.get("__probe__");
            get.onsuccess = () => {
              if (settled) return;
              settled = true; clearTimeout(timer);
              mode = "idb";
              tx.objectStore("kv").delete("__probe__"); // 清理探针
              resolve(mode);
            };
            get.onerror = () => { clearTimeout(timer); try { db.close(); } catch {} dbPromise = null; fallback(); };
          } catch { clearTimeout(timer); dbPromise = null; fallback(); }
        };
        req.onerror = () => { clearTimeout(timer); fallback(); };
        req.onblocked = () => { clearTimeout(timer); fallback(); };
      } catch { clearTimeout(timer); fallback(); }
    });
  }

  /* ---------- IndexedDB 实现 ---------- */
  function idb() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains("novels")) db.createObjectStore("novels", { keyPath: "id" });
        if (!db.objectStoreNames.contains("kv")) db.createObjectStore("kv");
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }
  function reqVal(req) {
    return new Promise((resolve, reject) => {
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  /* ---------- localStorage 实现 ---------- */
  function lsNovels() { try { return JSON.parse(localStorage.getItem(LS_NOVELS) || "{}"); } catch { return {}; } }
  function lsSaveNovels(map) { localStorage.setItem(LS_NOVELS, JSON.stringify(map)); }
  function lsKv() { try { return JSON.parse(localStorage.getItem(LS_KV) || "{}"); } catch { return {}; } }

  /* ---------- 结构迁移：老版本作品缺字段时补齐 ---------- */
  function migrate(n) {
    if (!n || typeof n !== "object") return n;
    if (!Array.isArray(n.facts)) n.facts = [];
    if (!Array.isArray(n.threads)) n.threads = [];
    if (!Array.isArray(n.characters)) n.characters = [];
    if (!Array.isArray(n.blueprints)) n.blueprints = [];
    if (!Array.isArray(n.chapters)) n.chapters = [];
    if (!Array.isArray(n.materials)) n.materials = [];
    n.characters.forEach(c => {
      if (!c.state || typeof c.state !== "object") c.state = {};
      if (c.stateSource !== "author") c.stateSource = c.stateSource || "unknown";
    });
    n.chapters.forEach(c => {
      if (!Array.isArray(c.review)) c.review = [];
      if (!Array.isArray(c.reviewResolved)) c.reviewResolved = [];
      if (typeof c.factsDone !== "boolean") c.factsDone = false;
    });
    return n;
  }

  /* ---------- 对外 API ---------- */
  async function listNovels() {
    if (await detect() === "ls") return Object.values(lsNovels()).map(migrate).sort((a, b) => b.updatedAt - a.updatedAt);
    const db = await idb();
    const all = await reqVal(db.transaction("novels").objectStore("novels").getAll());
    return (all || []).map(migrate);
  }
  async function getNovel(id) {
    if (await detect() === "ls") return migrate(lsNovels()[id]);
    const db = await idb();
    return migrate(await reqVal(db.transaction("novels").objectStore("novels").get(id)));
  }
  async function putNovel(novel) {
    novel.updatedAt = Date.now();
    if (await detect() === "ls") { const m = lsNovels(); m[novel.id] = novel; lsSaveNovels(m); return novel.id; }
    const db = await idb();
    return reqVal(db.transaction("novels", "readwrite").objectStore("novels").put(novel));
  }
  async function deleteNovel(id) {
    if (await detect() === "ls") { const m = lsNovels(); delete m[id]; lsSaveNovels(m); return; }
    const db = await idb();
    return reqVal(db.transaction("novels", "readwrite").objectStore("novels").delete(id));
  }
  async function kvGet(key, fallback) {
    if (await detect() === "ls") { const m = lsKv(); return key in m ? m[key] : fallback; }
    const db = await idb();
    const v = await reqVal(db.transaction("kv").objectStore("kv").get(key));
    return v === undefined ? fallback : v;
  }
  async function kvSet(key, value) {
    if (await detect() === "ls") { const m = lsKv(); m[key] = value; localStorage.setItem(LS_KV, JSON.stringify(m)); return; }
    const db = await idb();
    return reqVal(db.transaction("kv", "readwrite").objectStore("kv").put(value, key));
  }

  /* ---------- 工厂 ---------- */
  function newNovel(name) {
    const palettes = [
      ["#8c3b2e", "#c96f4a"], ["#2e5e8c", "#5a9bc9"], ["#3e7d4f", "#7db88f"],
      ["#7a4a8c", "#b58ac9"], ["#8c6d2e", "#c9a75a"], ["#414a54", "#7d8a99"],
    ];
    const p = palettes[Math.floor(Math.random() * palettes.length)];
    return {
      id: "n" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      name: name || "未命名作品",
      createdAt: Date.now(),
      updatedAt: Date.now(),
      cover: `linear-gradient(135deg, ${p[0]}, ${p[1]})`,
      config: {
        genre: "", subGenre: "", targetAudience: "",
        totalChapters: 100, wordsPerChapter: 2500,
        plotStructure: "three_act", narrativePOV: "third_limited",
        coreOutline: "", worldSetting: "", goldenFinger: "",
        protagonistProfile: "", writingStyle: "", globalGuidance: "",
      },
      characters: [],
      blueprints: [],
      chapters: [],      // {chapterNumber, title, status, content, summary, wordCount, updatedAt, versions:[]}
      facts: [],         // 连续性事实（定稿后沉淀）: {chapterNumber, characterStates[], timeline, openThreads[], plotFacts[]}
      threads: [],       // 伏笔线索: {id, thread, status, plantedAt, lastMovedAt}
      materials: [],     // 参考资料: {id, title, source, chars, chunks[], enabled}
      novelInfoSet: false, // 架构四节是否已确认过
    };
  }

  function newChapter(n, num, title) {
    return {
      chapterNumber: num, title: title || `第${num}章`,
      status: "待写", content: "", summary: "",
      wordCount: 0, updatedAt: Date.now(), versions: [],
      review: [],        // 最近一次审稿意见（结构化）
      reviewResolved: [],// 复验结果
      factsDone: false,  // 是否已抽取连续性事实
    };
  }

  return { listNovels, getNovel, putNovel, deleteNovel, kvGet, kvSet, newNovel, newChapter, detect };
})();

</script>
<script>
/* ============================================================
   码字仪表（悬浮窗）
   ------------------------------------------------------------
   参考了几个开源实现的做法，没有直接引依赖，按移动端重写：
   · yilujian/easy-writing       —— 今日字数 / 目标 / 手写与 AI 产出分开记账
   · Novel-Helper-Project/andrea-novel-helper —— CPM 实时码字速度
   · ZZ0R0/Overlay (typing-pause-overlay) —— writing / idle 双计时、闲置提醒
   · lociere/novel-helper        —— 累计码字时间、平均速度
   纯本地：数据只写进 IndexedDB（kv），不联网、不上报。
   ============================================================ */
(function () {
  "use strict";

  const IDLE_GAP = 8000;        // 8 秒没有输入 → 开始计「摸鱼」
  const IDLE_WARN = 180000;     // 摸鱼超过 3 分钟 → 变琥珀色提示
  const TICK = 1000;
  const KEEP_DAYS = 60;
  const STORE_KEY = "writingStats";

  /* ---------------- 状态 ---------------- */
  let mainEl = null, pillEl = null, panelEl = null;
  let ta = null, lastLen = 0, lastInputAt = 0;
  let timer = 0, lastTick = 0, saveTick = 0;
  let enabled = true, paused = false;
  let store = { days: {}, goal: 3000 };
  let session = null;           // { startAt, activeMs, idleMs, hand, ai, samples: [] }
  let dirty = false;

  /* ---------------- 小工具 ---------------- */
  const pad = (n) => String(n).padStart(2, "0");
  function dayKey(d) {
    const x = d || new Date();
    return `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())}`;
  }
  function today() {
    const k = dayKey();
    if (!store.days[k]) store.days[k] = { hand: 0, ai: 0, activeMs: 0, idleMs: 0 };
    return store.days[k];
  }
  function hms(ms, short) {
    const s = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    if (short) return h ? `${h}h${m}m` : m ? `${m}m` : `${sec}s`;
    return h ? `${h}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
  }
  const fmtN = (n) => (n || 0).toLocaleString("en-US");
  const charCount = (s) => (s || "").replace(/\s/g, "").length;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  /* ---------------- 数据持久化 ---------------- */
  function persist(force) {
    if (!DB || !DB.kvSet) return;
    const now = Date.now();
    if (!force && now - saveTick < 8000) { dirty = true; return; }
    saveTick = now; dirty = false;
    const keys = Object.keys(store.days).sort();
    if (keys.length > KEEP_DAYS) keys.slice(0, keys.length - KEEP_DAYS).forEach(k => delete store.days[k]);
    try { DB.kvSet(STORE_KEY, store); } catch (e) {}
  }

  /* ---------------- 计时 ---------------- */
  function resetSession() {
    session = {
      startAt: Date.now(),
      activeMs: 0, idleMs: 0, hand: 0, ai: 0,
      samples: [],           // [{t, n}] 最近 10 分钟
    };
    lastInputAt = 0;
    lastTick = Date.now();
  }

  function tick() {
    if (!enabled || !session) return;
    const now = Date.now();
    const dt = clamp(now - lastTick, 0, 5000);
    lastTick = now;
    if (paused || document.visibilityState === "hidden") return;

    const d = today();
    if (now - lastInputAt <= IDLE_GAP) { session.activeMs += dt; d.activeMs += dt; }
    else { session.idleMs += dt; d.idleMs += dt; }

    /* AI 流式写入不走 input 事件，长度突变时静默对齐，避免把 AI 的字算成手写 */
    if (ta && now - lastInputAt > 1500) {
      const len = charCount(ta.value);
      if (len !== lastLen) lastLen = len;
    }
    paint();
    if (dirty) persist();
    else if (now - saveTick > 15000) persist();
  }

  /* ---------------- 输入采集 ---------------- */
  function onInput() {
    if (!enabled || !session) return;
    const now = Date.now();
    const len = charCount(ta.value);
    const delta = len - lastLen;
    lastLen = len;
    if (delta > 0) {
      session.hand += delta;
      today().hand += delta;
      session.samples.push({ t: now, n: delta });
    }
    lastInputAt = now;
    /* 输入当下的空闲时间由 tick 累计，这里只负责把状态切回「在写」 */
    paint();
    persist();
  }

  function recentChars(windowMs) {
    const now = Date.now();
    return (session ? session.samples : []).filter(s => now - s.t < windowMs).reduce((a, s) => a + s.n, 0);
  }

  /* ---------------- 渲染 ---------------- */
  function ensureDom() {
    if (mainEl) return;
    mainEl = document.createElement("div");
    mainEl.id = "wb-hud";
    mainEl.className = "wb-hud";
    mainEl.hidden = true;
    mainEl.innerHTML = `
      <button class="wb-pill" id="wb-pill" aria-label="码字仪表">
        <span class="wb-lead"><i id="wb-dot"></i></span>
        <span class="wb-body">
          <span class="wb-l1"><b id="wb-cpm">0</b><em>字/分</em></span>
          <span class="wb-l2" id="wb-line2">今日 0 字</span>
        </span>
      </button>
      <div class="wb-panel" id="wb-panel" hidden>
        <div class="wb-ph">
          <span>码字仪表</span>
          <button class="wb-x" id="wb-x" aria-label="收起">×</button>
        </div>
        <div class="wb-grid">
          <div><b id="wb-s-active">00:00</b><span>本次写作</span></div>
          <div><b id="wb-s-idle" class="warm">00:00</b><span>本次摸鱼</span></div>
          <div><b id="wb-s-avg">0</b><span>平均 字/分</span></div>
        </div>
        <div class="wb-day">
          <div class="wb-day-h"><span>今日</span><b id="wb-day-chars">0 字</b></div>
          <div class="wb-bar"><i id="wb-goal-bar"></i></div>
          <div class="wb-day-f" id="wb-day-foot">手写 0 · AI 0</div>
        </div>
        <div class="wb-spark-cap"><span>近 10 分钟</span><b id="wb-peak"></b></div>
        <div class="wb-spark" id="wb-spark"></div>
        <div class="wb-acts">
          <button id="wb-pause">暂停</button>
          <button id="wb-reset">清零本次</button>
          <button id="wb-hide">隐藏</button>
        </div>
      </div>`;
    document.body.appendChild(mainEl);
    bindDom();
    restorePos();
  }

  function bindDom() {
    pillEl = document.getElementById("wb-pill");
    panelEl = document.getElementById("wb-panel");

    let drag = null;
    const onDown = (e) => {
      const r = mainEl.getBoundingClientRect();
      drag = { x: e.clientX, y: e.clientY, left: r.left, top: r.top, moved: false, pid: e.pointerId };
      mainEl.classList.add("dragging");
      try { pillEl.setPointerCapture(e.pointerId); } catch (err) {}
    };
    const onMove = (e) => {
      if (!drag) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.moved && Math.hypot(dx, dy) < 6) return;
      drag.moved = true;
      const w = mainEl.offsetWidth, h = mainEl.offsetHeight;
      const left = clamp(drag.left + dx, 6, window.innerWidth - w - 6);
      const top = clamp(drag.top + dy, 56, window.innerHeight - h - 6);
      mainEl.style.left = left + "px";
      mainEl.style.top = top + "px";
      mainEl.style.right = "auto";
      mainEl.style.bottom = "auto";
    };
    const onUp = () => {
      if (!drag) return;
      const moved = drag.moved;
      drag = null;
      mainEl.classList.remove("dragging");
      if (moved) savePos();
      else togglePanel();
    };
    pillEl.addEventListener("pointerdown", onDown);
    pillEl.addEventListener("pointermove", onMove);
    pillEl.addEventListener("pointerup", onUp);
    pillEl.addEventListener("pointercancel", () => { drag = null; mainEl.classList.remove("dragging"); });

    document.getElementById("wb-x").onclick = (e) => { e.stopPropagation(); togglePanel(false); };
    document.getElementById("wb-pause").onclick = (e) => {
      e.stopPropagation();
      paused = !paused;
      lastTick = Date.now();
      e.currentTarget.textContent = paused ? "继续" : "暂停";
      mainEl.classList.toggle("paused", paused);
      paint();
    };
    document.getElementById("wb-reset").onclick = (e) => {
      e.stopPropagation();
      resetSession();
      paint();
      persist(true);
    };
    document.getElementById("wb-hide").onclick = (e) => {
      e.stopPropagation();
      setEnabled(false);
      if (State && State.settings) {
        State.settings.hud = false;
        DB.kvSet("settings", State.settings);
        toast("已隐藏，可在「设置 · 写作仪表」重新打开");
      }
    };
  }

  function savePos() {
    try {
      localStorage.setItem("wb.hud.pos", JSON.stringify({ left: mainEl.offsetLeft, top: mainEl.offsetTop }));
    } catch (e) {}
  }
  function restorePos() {
    try {
      const p = JSON.parse(localStorage.getItem("wb.hud.pos") || "null");
      if (p && typeof p.left === "number") {
        mainEl.style.left = clamp(p.left, 6, window.innerWidth - 140) + "px";
        mainEl.style.top = clamp(p.top, 56, window.innerHeight - 80) + "px";
        mainEl.style.right = "auto";
        mainEl.style.bottom = "auto";
      }
    } catch (e) {}
  }

  function togglePanel(force) {
    ensureDom();
    const open = typeof force === "boolean" ? force : panelEl.hidden;
    panelEl.hidden = !open;
    mainEl.classList.toggle("open", open);
    if (open) paint();
  }

  function paint() {
    if (!mainEl || mainEl.hidden || !session) return;
    const now = Date.now();
    const d = today();
    const cpm = recentChars(60000);
    const avg = session.activeMs > 3000 ? Math.round(session.hand / (session.activeMs / 60000)) : 0;
    const idle = now - lastInputAt > IDLE_GAP ? (now - lastInputAt) : 0;
    const warned = idle > IDLE_WARN;

    setText("wb-cpm", paused ? "—" : String(cpm));
    const line2 = mainEl.querySelector("#wb-line2");
    if (line2) {
      line2.textContent = paused
        ? "已暂停"
        : warned
          ? `已停笔 ${hms(idle)}`
          : `今日 ${fmtN(d.hand)} 字${idle > IDLE_GAP ? " · 停笔 " + hms(idle) : ""}`;
    }
    mainEl.classList.toggle("idle-warn", warned && !paused);
    mainEl.classList.toggle("typing", idle <= IDLE_GAP && !paused);
    /* 长时间没打字（在读稿/想情节）时淡出，别挡住字数；摸鱼提醒态保持清晰 */
    mainEl.classList.toggle("muted", idle > 10000 && !warned && !paused);

    if (!panelEl || panelEl.hidden) return;
    setText("wb-s-active", hms(session.activeMs));
    setText("wb-s-idle", hms(session.idleMs));
    setText("wb-s-avg", String(avg));
    setText("wb-day-chars", fmtN(d.hand + d.ai) + " 字");
    const goal = Math.max(200, store.goal || 3000);
    const pct = clamp((d.hand + d.ai) / goal * 100, 0, 100);
    const bar = document.getElementById("wb-goal-bar");
    if (bar) bar.style.width = pct.toFixed(1) + "%";
    setText("wb-day-foot", `手写 ${fmtN(d.hand)} · AI ${fmtN(d.ai)} · 写作 ${hms(d.activeMs, true)} · 摸鱼 ${hms(d.idleMs, true)}`);
    paintSpark();
  }

  function setText(id, v) {
    const el = document.getElementById(id);
    if (el && el.textContent !== v) el.textContent = v;
  }

  /* 最近 10 分钟，每分钟一根柱 */
  function paintSpark() {
    const host = document.getElementById("wb-spark");
    if (!host) return;
    const now = Date.now();
    const buckets = new Array(10).fill(0);
    (session.samples || []).forEach(s => {
      const idx = 9 - Math.floor((now - s.t) / 60000);
      if (idx >= 0 && idx < 10) buckets[idx] += s.n;
    });
    const max = Math.max(1, ...buckets);
    host.innerHTML = buckets.map((n, i) => {
      const h = n ? Math.max(8, Math.round(n / max * 100)) : 3;
      return `<i style="height:${h}%" class="${i === 9 ? "now" : ""}" title="${n} 字"></i>`;
    }).join("");
    const peak = Math.max(...buckets);
    const pk = document.getElementById("wb-peak");
    if (pk) pk.textContent = peak ? `峰值 ${peak} 字/分` : "";
  }

  /* ---------------- 对外接口 ---------------- */
  const HUD = {
    /** 启动/恢复本次写作会话（编辑器渲染后调用） */
    start(textarea) {
      if (!enabled) return;
      ensureDom();
      if (!session) resetSession();
      lastTick = Date.now();
      if (ta && ta !== textarea) ta.removeEventListener("input", onInput);
      ta = textarea;
      lastLen = charCount(ta.value);
      lastInputAt = Date.now();
      if (!ta._wbBound) { ta.addEventListener("input", onInput); ta._wbBound = true; }
      mainEl.hidden = false;
      clearInterval(timer);
      timer = setInterval(tick, TICK);
      paint();
    },
    /** 离开编辑页：结账并隐藏 */
    stop() {
      if (session) persist(true);
      clearInterval(timer);
      timer = 0;
      session = null;
      if (mainEl) { mainEl.hidden = true; togglePanel(false); }
      ta = null;
    },
    /** AI 生成的字单独记账，不混进手写速度 */
    addAI(n) {
      const v = Math.max(0, n | 0);
      if (!v) return;
      today().ai += v;
      if (session) session.ai += v;
      dirty = true;
      paint();
      persist();
    },
    /** 生成结束后把文本长度对齐，避免下次手写把 AI 的字算成自己的 */
    sync() {
      if (!ta) { lastLen = 0; return; }
      lastLen = charCount(ta.value);
      lastInputAt = Date.now();
    },
    setEnabled(on) {
      enabled = !!on;
      ensureDom();
      if (!enabled) { mainEl.hidden = true; togglePanel(false); clearInterval(timer); timer = 0; session = null; }
    },
    isEnabled() { return enabled; },
    open() { ensureDom(); mainEl.hidden = false; togglePanel(true); },
    /* 返回键用：展开面板时先收起 */
    isOpen() { return !!(panelEl && !panelEl.hidden && mainEl && !mainEl.hidden); },
    close() { togglePanel(false); },
    /** 手动改每日目标 */
    setGoal(n) { store.goal = clamp(parseInt(n) || 3000, 200, 50000); persist(true); paint(); },
    getGoal() { return store.goal || 3000; },
    /** 今日汇总，给「我的」页用 */
    summary() {
      const d = today();
      return { hand: d.hand, ai: d.ai, activeMs: d.activeMs, idleMs: d.idleMs, goal: store.goal || 3000, days: store.days };
    },
    /** 清空今日统计（历史日期保留） */
    resetToday() {
      const k = dayKey();
      store.days[k] = { hand: 0, ai: 0, activeMs: 0, idleMs: 0 };
      resetSession();
      dirty = true;
      persist(true);
      paint();
    },
    async load() {
      try {
        const s = await DB.kvGet(STORE_KEY, null);
        if (s && s.days) store = { days: s.days, goal: s.goal || 3000 };
      } catch (e) {}
      ensureDom();
    },
  };

  /* 切后台/翻页时落盘，避免节流期内丢数据 */
  document.addEventListener("visibilitychange", () => {
    if (!session) return;
    if (document.visibilityState === "hidden") persist(true);
    else lastTick = Date.now();
  });
  window.addEventListener("pagehide", () => { if (session) persist(true); });
  window.addEventListener("resize", () => {
    if (!mainEl || mainEl.hidden) return;
    if (mainEl.style.left) savePos();
  });

  window.HUD = HUD;
})();

</script>
<script>
/* ============================================================
 * 书童移动版 — 文本对齐 / 修稿合并 / 逐字对比
 * 段落对齐 DP 算法移植自桌面版 src/components/editor/merge-segments.ts
 *   支持 1:1 改写、1:2 / 1:3 拆段、2:1 / 3:1 并段
 * 字符级 diff 用 LCS（与 jsdiff 同源的思路），只在变化段落内计算
 * ============================================================ */
"use strict";

const Merge = (() => {
  /* ---------------- 文本工具 ---------------- */
  function stripFrontmatter(text) {
    const m = String(text || "").match(/^---\r?\n[\s\S]*?\r?\n---\r?\n?/);
    return m ? text.slice(m[0].length) : String(text || "");
  }

  /** 段落 = 非空行块；空行是分隔符 */
  function extractParagraphs(text) {
    const lines = stripFrontmatter(text).replace(/\r\n/g, "\n").split("\n");
    const paras = [];
    let buf = [];
    for (const line of lines) {
      if (line.trim() === "") {
        if (buf.length) { paras.push(buf.join("\n")); buf = []; }
      } else buf.push(line);
    }
    if (buf.length) paras.push(buf.join("\n"));
    return paras;
  }

  function buildCharFreq(text) {
    const freq = new Map();
    for (const c of text) freq.set(c, (freq.get(c) || 0) + 1);
    return freq;
  }
  function mergeFreqs(...maps) {
    const merged = new Map();
    for (const m of maps) for (const [c, n] of m) merged.set(c, (merged.get(c) || 0) + n);
    return merged;
  }
  function simFromFreqs(fa, lenA, fb, lenB) {
    if (lenA === 0 && lenB === 0) return 1;
    if (lenA === 0 || lenB === 0) return 0;
    if (lenA > lenB * 5 || lenB > lenA * 5) return 0;
    let common = 0;
    const [smaller, larger] = fa.size <= fb.size ? [fa, fb] : [fb, fa];
    for (const [c, n] of smaller) common += Math.min(n, larger.get(c) || 0);
    return (2 * common) / (lenA + lenB);
  }

  /* ---------------- DP 段落对齐 ---------------- */
  const MATCH = 0, DELETE = 1, INSERT = 2, SPLIT_1_2 = 3, SPLIT_1_3 = 4, MERGE_2_1 = 5, MERGE_3_1 = 6;

  function alignParagraphs(origParas, modParas) {
    const n = origParas.length, m = modParas.length;
    const SIM_THRESH = 0.15, GAP = -0.05;

    const oFreqs = origParas.map(buildCharFreq);
    const mFreqs = modParas.map(buildCharFreq);
    const oLens = origParas.map(p => p.length);
    const mLens = modParas.map(p => p.length);

    const mPairFreqs = new Array(m), mPairLens = new Array(m);
    for (let j = 1; j < m; j++) { mPairFreqs[j] = mergeFreqs(mFreqs[j - 1], mFreqs[j]); mPairLens[j] = mLens[j - 1] + mLens[j]; }
    const mTriFreqs = new Array(m), mTriLens = new Array(m);
    for (let j = 2; j < m; j++) { mTriFreqs[j] = mergeFreqs(mFreqs[j - 2], mFreqs[j - 1], mFreqs[j]); mTriLens[j] = mLens[j - 2] + mLens[j - 1] + mLens[j]; }
    const oPairFreqs = new Array(n), oPairLens = new Array(n);
    for (let i = 1; i < n; i++) { oPairFreqs[i] = mergeFreqs(oFreqs[i - 1], oFreqs[i]); oPairLens[i] = oLens[i - 1] + oLens[i]; }
    const oTriFreqs = new Array(n), oTriLens = new Array(n);
    for (let i = 2; i < n; i++) { oTriFreqs[i] = mergeFreqs(oFreqs[i - 2], oFreqs[i - 1], oFreqs[i]); oTriLens[i] = oLens[i - 2] + oLens[i - 1] + oLens[i]; }

    const W = m + 1;
    const dp = new Float64Array((n + 1) * W).fill(-1e9);
    const op = new Uint8Array((n + 1) * W);
    dp[0] = 0;
    for (let i = 1; i <= n; i++) { dp[i * W] = i * GAP; op[i * W] = DELETE; }
    for (let j = 1; j <= m; j++) { dp[j] = j * GAP; op[j] = INSERT; }

    for (let i = 1; i <= n; i++) {
      for (let j = 1; j <= m; j++) {
        let best = -1e9, bestOp = MATCH;
        const cur = i * W + j;

        const s11 = simFromFreqs(oFreqs[i - 1], oLens[i - 1], mFreqs[j - 1], mLens[j - 1]);
        const v11 = dp[(i - 1) * W + j - 1] + (s11 >= SIM_THRESH ? s11 : s11 - 0.5);
        if (v11 > best) { best = v11; bestOp = MATCH; }

        const vd = dp[(i - 1) * W + j] + GAP;
        if (vd > best) { best = vd; bestOp = DELETE; }
        const vi = dp[i * W + j - 1] + GAP;
        if (vi > best) { best = vi; bestOp = INSERT; }

        if (j >= 2) {
          const s = simFromFreqs(oFreqs[i - 1], oLens[i - 1], mPairFreqs[j - 1], mPairLens[j - 1]);
          if (s >= SIM_THRESH) { const v = dp[(i - 1) * W + j - 2] + s * 0.95; if (v > best) { best = v; bestOp = SPLIT_1_2; } }
        }
        if (j >= 3) {
          const s = simFromFreqs(oFreqs[i - 1], oLens[i - 1], mTriFreqs[j - 1], mTriLens[j - 1]);
          if (s >= SIM_THRESH) { const v = dp[(i - 1) * W + j - 3] + s * 0.9; if (v > best) { best = v; bestOp = SPLIT_1_3; } }
        }
        if (i >= 2) {
          const s = simFromFreqs(oPairFreqs[i - 1], oPairLens[i - 1], mFreqs[j - 1], mLens[j - 1]);
          if (s >= SIM_THRESH) { const v = dp[(i - 2) * W + j - 1] + s * 0.95; if (v > best) { best = v; bestOp = MERGE_2_1; } }
        }
        if (i >= 3) {
          const s = simFromFreqs(oTriFreqs[i - 1], oTriLens[i - 1], mFreqs[j - 1], mLens[j - 1]);
          if (s >= SIM_THRESH) { const v = dp[(i - 3) * W + j - 1] + s * 0.9; if (v > best) { best = v; bestOp = MERGE_3_1; } }
        }
        dp[cur] = best; op[cur] = bestOp;
      }
    }

    const pairs = [];
    let ci = n, cj = m;
    while (ci > 0 || cj > 0) {
      if (ci === 0) { pairs.unshift({ origIdx: [], modIdx: [--cj] }); continue; }
      if (cj === 0) { pairs.unshift({ origIdx: [--ci], modIdx: [] }); continue; }
      switch (op[ci * W + cj]) {
        case MATCH: pairs.unshift({ origIdx: [ci - 1], modIdx: [cj - 1] }); ci--; cj--; break;
        case DELETE: pairs.unshift({ origIdx: [ci - 1], modIdx: [] }); ci--; break;
        case INSERT: pairs.unshift({ origIdx: [], modIdx: [cj - 1] }); cj--; break;
        case SPLIT_1_2: pairs.unshift({ origIdx: [ci - 1], modIdx: [cj - 2, cj - 1] }); ci--; cj -= 2; break;
        case SPLIT_1_3: pairs.unshift({ origIdx: [ci - 1], modIdx: [cj - 3, cj - 2, cj - 1] }); ci--; cj -= 3; break;
        case MERGE_2_1: pairs.unshift({ origIdx: [ci - 2, ci - 1], modIdx: [cj - 1] }); ci -= 2; cj--; break;
        case MERGE_3_1: pairs.unshift({ origIdx: [ci - 3, ci - 2, ci - 1], modIdx: [cj - 1] }); ci -= 3; cj--; break;
        default: pairs.unshift({ origIdx: [ci - 1], modIdx: [cj - 1] }); ci--; cj--;
      }
    }
    return pairs;
  }

  function buildSegments(origParas, modParas, pairs) {
    const segments = [];
    let hunkIdx = 0;
    const parasToLines = (paras, indices) => {
      const lines = [];
      indices.forEach((idx, i) => {
        if (i > 0) lines.push("");
        lines.push(...paras[idx].split("\n"));
      });
      return lines;
    };
    for (let p = 0; p < pairs.length; p++) {
      const pair = pairs[p];
      const origLines = pair.origIdx.length ? parasToLines(origParas, pair.origIdx) : [];
      const modLines = pair.modIdx.length ? parasToLines(modParas, pair.modIdx) : [];
      const isSame = origLines.length > 0 && modLines.length > 0 &&
        origLines.length === modLines.length && origLines.every((l, i) => l === modLines[i]);
      if (isSame) segments.push({ type: "same", lines: origLines });
      else segments.push({ type: "hunk", hunk: { index: hunkIdx++, originalLines: origLines, modifiedLines: modLines } });
      if (p < pairs.length - 1) segments.push({ type: "same", lines: [""] });
    }
    return segments;
  }

  /** 入口：段落级对齐片段 */
  function computeSegments(original, modified) {
    const o = extractParagraphs(original);
    const m = extractParagraphs(modified);
    if (!o.length && !m.length) return [];
    /* 极端长文保护：段数过大时退化为顺序配对，避免 DP 卡住 */
    if (o.length * m.length > 250000) {
      const len = Math.max(o.length, m.length);
      const pairs = [];
      for (let i = 0; i < len; i++) pairs.push({ origIdx: i < o.length ? [i] : [], modIdx: i < m.length ? [i] : [] });
      return buildSegments(o, m, pairs);
    }
    return buildSegments(o, m, alignParagraphs(o, m));
  }

  /** 合并：segments + 每段选中的文字 → 全文 */
  function joinSegments(segments, texts) {
    return segments.map((s, i) => (texts[i] === undefined ? (s.lines || []).join("\n") : texts[i])).join("\n");
  }

  /** 统计改动处数 */
  function hunkCount(segments) {
    return segments.reduce((n, s) => n + (s.type === "hunk" ? 1 : 0), 0);
  }

  return { computeSegments, extractParagraphs, joinSegments, hunkCount, buildCharFreq, stripFrontmatter };
})();

/* ============================================================
 * 字符级 / 行级 diff（用于「版本逐字对比」）
 * 段落先做对齐，只有真正改写的段落才进 LCS，长章也不会卡
 * ============================================================ */
const TextDiff = (() => {
  const MAX_CELLS = 1_200_000;

  /** LCS 前缀/后缀裁剪 + DP 回溯 */
  function lcsOps(a, b) {
    let start = 0;
    const aLen = a.length, bLen = b.length;
    while (start < aLen && start < bLen && a[start] === b[start]) start++;
    let endA = aLen, endB = bLen;
    while (endA > start && endB > start && a[endA - 1] === b[endB - 1]) { endA--; endB--; }

    const A = a.slice(start, endA), B = b.slice(start, endB);
    const n = A.length, m = B.length;
    const ops = [];
    const push = (type, text) => {
      if (!text) return;
      const last = ops[ops.length - 1];
      if (last && last.type === type) last.text += text;
      else ops.push({ type, text });
    };
    push("eq", a.slice(0, start));

    if (!n && !m) { push("eq", a.slice(start, endA)); push("eq", a.slice(endA)); return ops; }
    if (!n) { push("ins", B); push("eq", a.slice(endA)); return ops; }
    if (!m) { push("del", A); push("eq", a.slice(endA)); return ops; }

    if ((n + 1) * (m + 1) > MAX_CELLS) {
      /* 太大：整段视为替换，避免一次性吃满内存 */
      push("del", A); push("ins", B); push("eq", a.slice(endA));
      return ops;
    }

    const W = m + 1;
    const dp = new Uint16Array((n + 1) * W);
    for (let i = 1; i <= n; i++) {
      const ai = A.charCodeAt(i - 1);
      for (let j = 1; j <= m; j++) {
        dp[i * W + j] = ai === B.charCodeAt(j - 1)
          ? dp[(i - 1) * W + j - 1] + 1
          : Math.max(dp[(i - 1) * W + j], dp[i * W + j - 1]);
      }
    }
    const stack = [];
    let i = n, j = m;
    while (i > 0 && j > 0) {
      if (A[i - 1] === B[j - 1]) { stack.push({ type: "eq", text: A[i - 1] }); i--; j--; }
      else if (dp[(i - 1) * W + j] >= dp[i * W + j - 1]) { stack.push({ type: "del", text: A[i - 1] }); i--; }
      else { stack.push({ type: "ins", text: B[j - 1] }); j--; }
    }
    while (i > 0) { stack.push({ type: "del", text: A[--i] }); }
    while (j > 0) { stack.push({ type: "ins", text: B[--j] }); }
    for (let k = stack.length - 1; k >= 0; k--) push(stack[k].type, stack[k].text);

    push("eq", a.slice(endA));
    return ops;
  }

  /** 字符级差异：返回 [{type:'eq'|'del'|'ins', text}] */
  function diffChars(a, b) { return lcsOps(String(a || ""), String(b || "")); }

  /**
   * 段落级差异视图：返回 [{kind:'same'|'change', original, modified, ops?}]
   * same 段落直接跳过字符计算；change 段落带字符级 ops
   */
  function diffParagraphs(original, modified) {
    const segments = Merge.computeSegments(original, modified);
    const out = [];
    for (const s of segments) {
      if (s.type === "same") { out.push({ kind: "same", original: (s.lines || []).join("\n") }); continue; }
      const h = s.hunk;
      out.push({
        kind: "change",
        original: h.originalLines.join("\n"),
        modified: h.modifiedLines.join("\n"),
        ops: lcsOps(h.originalLines.join("\n"), h.modifiedLines.join("\n")),
      });
    }
    return out;
  }

  /** 差异统计：新增/删除字符数 */
  function stat(ops) {
    let added = 0, removed = 0;
    for (const o of ops) {
      if (o.type === "ins") added += o.text.length;
      else if (o.type === "del") removed += o.text.length;
    }
    return { added, removed };
  }

  return { diffChars, diffParagraphs, stat };
})();

</script>
<script>
/* ============================================================
 * 书童移动版 — 角色关系图谱
 * 桌面版只有 GraphGeneration 走大模型出图；移动端做成本地渲染：
 *   1) 先从角色卡 relationships 文本解析关系边（零成本）
 *   2) 需要更完整时再调 AI 抽取（JSON → 边）
 * 布局用环形 + 按角色阵营分色，点击节点高亮相邻关系
 * ============================================================ */
"use strict";

const Graph = (() => {
  /* 关系类型 → 线色 / 线型 */
  const KINDS = [
    { id: "kin", label: "血缘亲情", test: /父|母|子|女|兄|弟|姐|妹|亲|族|血缘|养父|养母|舅舅|叔叔|姑姑|姨/ },
    { id: "love", label: "情感", test: /恋|爱|夫|妻|婚|青梅|暗恋|情侣|白月光|红颜|倾心/ },
    { id: "master", label: "师承", test: /师|徒|弟子|传承|授业|门人/ },
    { id: "enemy", label: "敌对", test: /敌|仇|对立|宿敌|叛|恨|追杀|竞争|对手/ },
    { id: "ally", label: "同盟", test: /友|盟|伙伴|同伴|队友|搭档|并肩|合作/ },
    { id: "serve", label: "从属", test: /下属|上司|主仆|效忠|麾下|部下|老板|属下/ },
  ];
  const KIND_COLOR = { kin: "#a2402c", love: "#c2607a", master: "#3e7d4f", enemy: "#8c3524", ally: "#2e5e8c", serve: "#7a4a8c", other: "#968e7f" };

  function kindOf(relation) {
    for (const k of KINDS) if (k.test.test(relation)) return k.id;
    return "other";
  }

  const NAME_RE = /[\u4e00-\u9fa5A-Za-z·]{2,7}/;

  /** 名字归一：命中已有角色名或别名则返回该角色 id */
  function resolve(name, characters) {
    const raw = String(name || "").replace(/[（(].*?[）)]/g, "").trim();
    if (!raw) return null;
    for (const c of characters) {
      if (c.name === raw) return c.id || c.name;
      if (Array.isArray(c.aliases) && c.aliases.includes(raw)) return c.id || c.name;
      if (typeof c.aliases === "string" && c.aliases.split(/[、,，\s]/).includes(raw)) return c.id || c.name;
    }
    /* 允许简称：角色名包含解析名（如「林小满」写作「小满」） */
    const fuzzy = characters.find(c => c.name && (c.name.includes(raw) || raw.includes(c.name)));
    return fuzzy ? (fuzzy.id || fuzzy.name) : null;
  }

  /** 从自由文本关系解析出边 */
  function parseRelations(characters) {
    const edges = [];
    const seen = new Set();
    const push = (fromId, toId, relation, source) => {
      if (!fromId || !toId || fromId === toId) return;
      const key = [fromId, toId].sort().join("|") + "|" + relation.slice(0, 8);
      if (seen.has(key)) return;
      seen.add(key);
      edges.push({ a: fromId, b: toId, relation, kind: kindOf(relation), source: source || "card" });
    };

    for (const c of characters) {
      const selfId = c.id || c.name;
      const text = c.relationships;
      if (!text) continue;
      for (const chunk of String(text).split(/[；;。\n]/)) {
        const seg = chunk.trim();
        if (!seg) continue;
        let matched = false;

        /* 形式一：与张三（师徒） / 张三（青梅竹马） */
        const paren = seg.match(/(?:与|和|跟|同)?\s*([\u4e00-\u9fa5A-Za-z·]{2,7})\s*[（(]([^）)]{1,20})[）)]/);
        if (paren) {
          const id = resolve(paren[1], characters);
          if (id) { push(selfId, id, paren[2].trim(), "card"); matched = true; }
        }

        /* 形式二：与张三：师徒关系 */
        if (!matched) {
          const colon = seg.match(/(?:与|和|跟|同)?\s*([\u4e00-\u9fa5A-Za-z·]{2,7})\s*[：:]\s*(.{1,30})/);
          if (colon) {
            const id = resolve(colon[1], characters);
            if (id) { push(selfId, id, colon[2].trim().replace(/[，,]$/, ""), "card"); matched = true; }
          }
        }

        /* 形式三：张三是他的师父 */
        if (!matched) {
          const plain = seg.match(NAME_RE);
          if (plain) {
            const id = resolve(plain[0], characters);
            if (id && id !== selfId) push(selfId, id, seg.replace(plain[0], "").replace(/^[是为，,、\s]+/, "").trim() || "相关", "card");
          }
        }
      }
    }
    return edges;
  }

  /** 合并 AI 结果与卡片解析结果 */
  function mergeEdges(parsed, ai) {
    const seen = new Set();
    const out = [];
    for (const e of [...(ai || []), ...parsed]) {
      const key = [e.a, e.b].sort().join("|");
      if (seen.has(key)) continue;
      seen.add(key);
      out.push(e);
    }
    return out;
  }

  /* ---------------- 渲染 ---------------- */
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

  const ROLE_COLOR = { protagonist: "#a2402c", antagonist: "#5b554a", supporting: "#2e5e8c", minor: "#968e7f" };
  const ROLE_LABEL = { protagonist: "主角", antagonist: "反派", supporting: "配角", minor: "次要" };

  function nodeRadius(count) { return count > 16 ? 13 : count > 9 ? 16 : 19; }

  /** 生成 SVG 字符串；size 为画布边长 */
  function svg(characters, edges, activeId, size) {
    const W = size || 340;
    const cx = W / 2, cy = W / 2;
    const nodes = characters.map((c, i) => {
      const n = characters.length;
      const R = n <= 8 ? W * 0.34 : W * 0.38;
      const ang = (i / n) * Math.PI * 2 - Math.PI / 2;
      return {
        id: c.id || c.name,
        name: c.name || "未命名",
        role: c.role || "minor",
        x: cx + Math.cos(ang) * R,
        y: cy + Math.sin(ang) * R,
      };
    });
    const byId = new Map(nodes.map(n => [n.id, n]));
    const r = nodeRadius(nodes.length);

    const edgeSvg = edges.map(e => {
      const A = byId.get(e.a), B = byId.get(e.b);
      if (!A || !B) return "";
      const active = !activeId || e.a === activeId || e.b === activeId;
      const color = KIND_COLOR[e.kind] || KIND_COLOR.other;
      const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
      /* 轻微弯折，避免多条边重叠成一条 */
      const dx = B.x - A.x, dy = B.y - A.y;
      const len = Math.hypot(dx, dy) || 1;
      const bow = e.kind === "enemy" ? 0.12 : e.kind === "love" ? -0.12 : 0.05;
      const qx = mx - dy * bow, qy = my + dx * bow;
      return `<path d="M${A.x.toFixed(1)} ${A.y.toFixed(1)} Q${qx.toFixed(1)} ${qy.toFixed(1)} ${B.x.toFixed(1)} ${B.y.toFixed(1)}"
        fill="none" stroke="${color}" stroke-width="${active ? 1.9 : 1.1}" opacity="${active ? 0.85 : 0.18}"
        stroke-dasharray="${e.kind === "enemy" ? "5 3" : e.kind === "serve" ? "2 3" : "none"}"/>`;
    }).join("");

    const nodeSvg = nodes.map(n => {
      const active = !activeId || n.id === activeId;
      const color = ROLE_COLOR[n.role] || ROLE_COLOR.minor;
      const label = n.name.length > 4 ? n.name.slice(0, 4) : n.name;
      return `<g class="g-node" data-node="${esc(n.id)}" style="cursor:pointer" opacity="${active ? 1 : 0.35}">
        <circle cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${r}" fill="var(--bg-elev)" stroke="${color}" stroke-width="${activeId === n.id ? 3 : 1.8}"/>
        <circle cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${r - 5}" fill="${color}" opacity="0.12"/>
        <text x="${n.x.toFixed(1)}" y="${(n.y + 4).toFixed(1)}" text-anchor="middle" font-size="${r > 15 ? 11 : 9.5}"
          fill="var(--ink)" font-family="var(--font-serif)">${esc(label)}</text>
        ${activeId === n.id ? `<text x="${n.x.toFixed(1)}" y="${(n.y + r + 13).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${esc(ROLE_LABEL[n.role] || "")}</text>` : ""}
      </g>`;
    }).join("");

    return `<svg viewBox="0 0 ${W} ${W}" width="100%" style="display:block;max-height:56vh" xmlns="http://www.w3.org/2000/svg">
      <g>${edgeSvg}</g><g>${nodeSvg}</g>
    </svg>`;
  }

  return { parseRelations, mergeEdges, svg, kindOf, resolve, KIND_COLOR, ROLE_LABEL };
})();

</script>
<script>
/* ============================================================
 * 书童移动版 — 导出
 * 对齐桌面版 src/services/export-service.ts 的三种格式：
 *   merged-md 合并稿 / split-md 分章稿（打包 zip）/ txt 纯文本
 * zip 用 store（不压缩）自写，避免引入第三方库；中文名走 UTF-8 标志位
 * ============================================================ */
"use strict";

const Exporter = (() => {
  /* ---------------- CRC32 ---------------- */
  const CRC_TABLE = (() => {
    const table = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      table[i] = c >>> 0;
    }
    return table;
  })();

  function crc32(bytes) {
    let c = 0xffffffff;
    for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
    return (c ^ 0xffffffff) >>> 0;
  }

  const enc = new TextEncoder();

  function dosDateTime(d) {
    const time = ((d.getHours() & 31) << 11) | ((d.getMinutes() & 63) << 5) | ((d.getSeconds() / 2) & 31);
    const date = (((d.getFullYear() - 1980) & 127) << 9) | (((d.getMonth() + 1) & 15) << 5) | (d.getDate() & 31);
    return { time, date };
  }

  /** files: [{name, text}] → Blob（zip，store 模式） */
  function zip(files, when) {
    const now = when || new Date();
    const { time, date } = dosDateTime(now);
    const locals = [];
    const centrals = [];
    let offset = 0;

    for (const f of files) {
      const nameBytes = enc.encode(f.name);
      const data = enc.encode(f.text);
      const crc = crc32(data);

      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true);
      lh.setUint16(4, 20, true);          // version needed
      lh.setUint16(6, 0x0800, true);      // UTF-8 文件名
      lh.setUint16(8, 0, true);           // store
      lh.setUint16(10, time, true);
      lh.setUint16(12, date, true);
      lh.setUint32(14, crc, true);
      lh.setUint32(18, data.length, true);
      lh.setUint32(22, data.length, true);
      lh.setUint16(26, nameBytes.length, true);
      lh.setUint16(28, 0, true);

      const localParts = [new Uint8Array(lh.buffer), nameBytes, data];
      const localSize = 30 + nameBytes.length + data.length;
      locals.push(...localParts);

      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true);
      ch.setUint16(4, 20, true);
      ch.setUint16(6, 20, true);
      ch.setUint16(8, 0x0800, true);
      ch.setUint16(10, 0, true);
      ch.setUint16(12, time, true);
      ch.setUint16(14, date, true);
      ch.setUint32(16, crc, true);
      ch.setUint32(20, data.length, true);
      ch.setUint32(24, data.length, true);
      ch.setUint16(28, nameBytes.length, true);
      ch.setUint16(30, 0, true);
      ch.setUint16(32, 0, true);
      ch.setUint16(34, 0, true);
      ch.setUint16(36, 0, true);
      ch.setUint32(38, 0, true);
      ch.setUint32(42, offset, true);
      centrals.push(new Uint8Array(ch.buffer), nameBytes);

      offset += localSize;
    }

    const centralSize = centrals.reduce((n, b) => n + b.length, 0);
    const eocd = new DataView(new ArrayBuffer(22));
    eocd.setUint32(0, 0x06054b50, true);
    eocd.setUint16(8, files.length, true);
    eocd.setUint16(10, files.length, true);
    eocd.setUint32(12, centralSize, true);
    eocd.setUint32(16, offset, true);

    return new Blob([...locals, ...centrals, new Uint8Array(eocd.buffer)], { type: "application/zip" });
  }

  /* ---------------- 内容拼装 ---------------- */
  function pad3(n) { return String(n).padStart(3, "0"); }

  /** 章节正文去掉重复的章标题行 */
  function bodyOf(c, num) {
    const lines = String(c.content || "").replace(/\r\n/g, "\n").split("\n");
    if (lines.length && new RegExp(`^\\s*第\\s*${num}\\s*章`).test(lines[0])) lines.shift();
    return lines.join("\n").replace(/^\n+/, "").trim();
  }

  function chapterHeading(c, num) {
    const t = String(c.title || "").replace(new RegExp(`^第\\s*${num}\\s*章\\s*`), "").trim();
    return t ? `第${num}章 ${t}` : `第${num}章`;
  }

  function sortedChapters(n) {
    return [...(n.chapters || [])].filter(c => (c.content || "").trim()).sort((a, b) => a.chapterNumber - b.chapterNumber);
  }

  function outlineMd(n) {
    const cfg = n.config || {};
    const out = [`# ${n.name || "未命名作品"} · 大纲`, ""];
    out.push("## 作品设定", "");
    const field = (k, v) => { if (v) out.push(`- **${k}**：${v}`); };
    field("题材", [cfg.genre, cfg.subGenre].filter(Boolean).join(" / "));
    field("目标读者", cfg.targetAudience);
    field("计划章数", cfg.totalChapters ? `${cfg.totalChapters} 章` : "");
    field("单章目标", cfg.wordsPerChapter ? `${cfg.wordsPerChapter} 字` : "");
    field("叙事视角", cfg.narrativePOV);
    if (cfg.coreOutline) out.push("", "### 故事前提", "", cfg.coreOutline);
    if (cfg.worldSetting) out.push("", "### 世界观", "", cfg.worldSetting);
    if (cfg.goldenFinger) out.push("", "### 核心设定", "", cfg.goldenFinger);
    if (cfg.protagonistProfile) out.push("", "### 主角", "", cfg.protagonistProfile);
    if (cfg.writingStyle) out.push("", "### 文风", "", cfg.writingStyle);
    if (cfg.globalGuidance) out.push("", "### 全局写作指导", "", cfg.globalGuidance);

    if ((n.characters || []).length) {
      out.push("", "## 角色", "");
      for (const c of n.characters) {
        const bits = [c.role, c.gender, c.age].filter(Boolean).join(" · ");
        out.push(`### ${c.name || "未命名"}${bits ? `（${bits}）` : ""}`);
        if (c.personality) out.push(`- 性格：${c.personality}`);
        if (c.background) out.push(`- 背景：${c.background}`);
        if (c.motivation) out.push(`- 动机：${c.motivation}`);
        if (c.relationships) out.push(`- 关系：${c.relationships}`);
        out.push("");
      }
    }

    if ((n.blueprints || []).length) {
      out.push("## 分章蓝图", "");
      const bps = [...n.blueprints].sort((a, b) => a.chapterNumber - b.chapterNumber);
      for (const b of bps) {
        out.push(`### 第${b.chapterNumber}章 ${b.title || ""}`.trim());
        if (b.keyEvents) out.push(b.keyEvents);
        if (b.suspenseHook) out.push(`> 钩子：${b.suspenseHook}`);
        out.push("");
      }
    }
    return out.join("\n");
  }

  function mergedMd(n, opts) {
    const o = opts || {};
    const out = [`# ${n.name || "未命名作品"}`, ""];
    if (o.includeOutline) {
      out.push(outlineMd(n), "");
      out.push("---", "");
    }
    if (o.includeCharacters && !o.includeOutline && (n.characters || []).length) {
      out.push("## 人物表", "");
      for (const c of n.characters) out.push(`- **${c.name || "未命名"}**${c.role ? `（${c.role}）` : ""}：${c.personality || c.background || ""}`);
      out.push("", "---", "");
    }
    for (const c of sortedChapters(n)) {
      out.push(`## ${chapterHeading(c, c.chapterNumber)}`, "");
      const body = bodyOf(c, c.chapterNumber);
      if (body) out.push(body, "");
    }
    return out.join("\n");
  }

  function splitMd(n) {
    const files = [];
    if ((n.blueprints || []).length) files.push({ name: "00-大纲.md", text: outlineMd(n) });
    for (const c of sortedChapters(n)) {
      const body = bodyOf(c, c.chapterNumber);
      files.push({
        name: `第${pad3(c.chapterNumber)}章 ${String(c.title || "").replace(new RegExp(`^第\\s*${c.chapterNumber}\\s*章\\s*`), "").trim() || "正文"}.md`
          .replace(/[\\/:*?"<>|]/g, "_"),
        text: `# ${chapterHeading(c, c.chapterNumber)}\n\n${body}\n`,
      });
    }
    return files;
  }

  function txt(n) {
    const out = [n.name || "未命名作品", ""];
    for (const c of sortedChapters(n)) {
      out.push(chapterHeading(c, c.chapterNumber), "", bodyOf(c, c.chapterNumber), "");
    }
    return out.join("\n");
  }

  /* ---------------- 下载 ---------------- */
  function download(blob, filename) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  }

  const safeName = (s) => String(s || "作品").replace(/[\\/:*?"<>|]/g, "_").slice(0, 40);

  function run(n, format, opts) {
    const o = opts || {};
    const base = safeName(n.name) + "-" + new Date().toISOString().slice(0, 10);
    if (format === "split-md") {
      const files = splitMd(n);
      if (!files.length) throw new Error("还没有可导出的章节");
      download(zip(files), base + "-分章.zip");
      return files.length;
    }
    if (format === "txt") {
      const text = txt(n);
      if (!text.trim()) throw new Error("还没有可导出的正文");
      download(new Blob(["\ufeff" + text], { type: "text/plain;charset=utf-8" }), base + ".txt");
      return 1;
    }
    const md = mergedMd(n, o);
    if (!md.trim()) throw new Error("还没有可导出的内容");
    download(new Blob([md], { type: "text/markdown;charset=utf-8" }), base + ".md");
    return 1;
  }

  return { run, zip, mergedMd, splitMd, outlineMd, txt, download, safeName };
})();

</script>
<script>
/* ============================================================
 * 书童移动版 — EPUB 解析
 * 桌面版用 yauzl + Node 流；浏览器里用原生 DecompressionStream('deflate-raw')
 * 自己读 zip 中央目录，再按 META-INF/container.xml → OPF → spine 取章节
 * 不做 DRM 破解：检测到加密正文直接报错
 * ============================================================ */
"use strict";

const Epub = (() => {
  const dec = new TextDecoder("utf-8");
  const decGb = new TextDecoder("gb18030");

  function hasInflate() {
    return typeof DecompressionStream === "function";
  }

  /* ---------------- zip 目录 ---------------- */
  function readZip(buf) {
    const view = new DataView(buf);
    /* EOCD 在文件尾部，最多回溯 64KB（含注释） */
    let eocd = -1;
    const floor = Math.max(0, buf.byteLength - 66000);
    for (let i = buf.byteLength - 22; i >= floor; i--) {
      if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error("不是有效的 EPUB（zip 结构缺失）");
    const count = view.getUint16(eocd + 10, true);
    const cdOffset = view.getUint32(eocd + 16, true);
    if (!count || cdOffset >= buf.byteLength) throw new Error("EPUB 目录为空");

    const entries = new Map();
    let p = cdOffset;
    for (let i = 0; i < count; i++) {
      if (p + 46 > buf.byteLength || view.getUint32(p, true) !== 0x02014b50) break;
      const method = view.getUint16(p + 10, true);
      const csize = view.getUint32(p + 20, true);
      const usize = view.getUint32(p + 24, true);
      const nameLen = view.getUint16(p + 28, true);
      const extraLen = view.getUint16(p + 30, true);
      const commentLen = view.getUint16(p + 32, true);
      const localOffset = view.getUint32(p + 42, true);
      /* 少数打包工具（含 Windows 自带压缩）用反斜杠分隔，统一成正斜杠 */
      const name = dec.decode(new Uint8Array(buf, p + 46, nameLen)).replace(/\\/g, "/");
      entries.set(name, { method, csize, usize, localOffset });
      p += 46 + nameLen + extraLen + commentLen;
    }
    return entries;
  }

  async function entryBytes(buf, entry) {
    const view = new DataView(buf);
    const p = entry.localOffset;
    if (p + 30 > buf.byteLength || view.getUint32(p, true) !== 0x04034b50) throw new Error("EPUB 条目损坏");
    const nameLen = view.getUint16(p + 26, true);
    const extraLen = view.getUint16(p + 28, true);
    const start = p + 30 + nameLen + extraLen;
    const raw = new Uint8Array(buf, start, entry.csize);
    if (entry.method === 0) return raw;
    if (entry.method !== 8) throw new Error("EPUB 使用了不支持的压缩方式");
    if (!hasInflate()) throw new Error("当前系统组件太旧，无法解压 EPUB。请改用 .txt 导入，或升级系统 WebView");
    const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  async function entryText(buf, entries, name) {
    const e = entries.get(name);
    if (!e) return "";
    const bytes = await entryBytes(buf, e);
    const utf8 = dec.decode(bytes);
    /* 老书常见 GBK 声明，替换字符过多时用 gb18030 重解 */
    if ((utf8.match(/\ufffd/g) || []).length > 8) return decGb.decode(bytes);
    return utf8;
  }

  /* ---------------- 路径与 XML ---------------- */
  function resolvePath(baseDir, rel) {
    const clean = decodeURIComponent(String(rel || "").split(/[?#]/)[0]);
    const parts = (baseDir ? baseDir.split("/") : []).concat(clean.split("/"));
    const stack = [];
    for (const part of parts) {
      if (!part || part === ".") continue;
      if (part === "..") stack.pop();
      else stack.push(part);
    }
    return stack.join("/");
  }
  function dirOf(p) { const i = p.lastIndexOf("/"); return i < 0 ? "" : p.slice(0, i); }

  function decodeEntities(s) {
    const named = { amp: "&", apos: "'", gt: ">", lt: "<", nbsp: " ", quot: '"' };
    return s.replace(/&(#x[\da-f]+|#\d+|[a-z]+);/gi, (m, body) => {
      if (body[0] !== "#") return named[body.toLowerCase()] ?? m;
      const hex = body[1] && body[1].toLowerCase() === "x";
      const cp = parseInt(body.slice(hex ? 2 : 1), hex ? 16 : 10);
      try { return Number.isFinite(cp) ? String.fromCodePoint(cp) : m; } catch { return m; }
    });
  }

  function attrs(source) {
    const out = {};
    for (const m of source.matchAll(/([\w:-]+)\s*=\s*(["'])(.*?)\2/g)) out[m[1].toLowerCase()] = decodeEntities(m[3]);
    return out;
  }

  /** xhtml → 纯段落文本 */
  function htmlToText(html) {
    let s = String(html || "");
    s = s.replace(/<(script|style|head)[\s\S]*?<\/\1>/gi, "");
    s = s.replace(/<\/(p|div|section|article|li|h[1-6]|tr|blockquote)>/gi, "\n");
    s = s.replace(/<br\s*\/?>/gi, "\n");
    s = s.replace(/<[^>]+>/g, "");
    s = decodeEntities(s);
    return s
      .replace(/\r\n?/g, "\n")
      .split("\n")
      .map(l => l.replace(/[\t\u00a0\u3000]+/g, " ").trim())
      .filter((l, i, arr) => l || (arr[i - 1] && arr[i - 1] !== ""))
      .join("\n")
      .replace(/\n{3,}/g, "\n\n")
      .trim();
  }

  function titleOf(html, fallback) {
    const h = String(html || "");
    for (const tag of ["h1", "h2", "h3", "title"]) {
      const m = h.match(new RegExp(`<${tag}[^>]*>([\\s\\S]*?)<\\/${tag}>`, "i"));
      if (m) {
        const t = decodeEntities(m[1].replace(/<[^>]+>/g, "")).replace(/\s+/g, " ").trim();
        if (t && t.length <= 60) return t;
      }
    }
    return fallback;
  }

  /* ---------------- 主流程 ---------------- */
  async function parse(arrayBuffer, onProgress) {
    const buf = arrayBuffer instanceof ArrayBuffer ? arrayBuffer : arrayBuffer.buffer;
    const entries = readZip(buf);
    if (!entries.size) throw new Error("EPUB 里没有文件");

    /* DRM：加密正文直接拒绝（字体混淆不算） */
    if (entries.has("META-INF/encryption.xml")) {
      const encXml = await entryText(buf, entries, "META-INF/encryption.xml");
      if (/EncryptedData/i.test(encXml) && !/font/i.test(encXml)) {
        throw new Error("这本 EPUB 带 DRM 加密，无法解析。请用无 DRM 的版本或转成 .txt");
      }
    }

    const container = await entryText(buf, entries, "META-INF/container.xml");
    let opfPath = "";
    const rootMatch = container.match(/<rootfile[^>]*full-path\s*=\s*(["'])(.*?)\1/i);
    if (rootMatch) opfPath = decodeURIComponent(rootMatch[2]);
    if (!opfPath) opfPath = [...entries.keys()].find(k => /\.opf$/i.test(k)) || "";
    if (!opfPath) throw new Error("EPUB 缺少 OPF 清单");

    const opf = await entryText(buf, entries, opfPath);
    const baseDir = dirOf(opfPath);

    /* manifest */
    const manifest = new Map();
    for (const m of opf.matchAll(/<item\b([^>]*)\/?>/gi)) {
      const a = attrs(m[1]);
      if (a.id && a.href) manifest.set(a.id, { href: a.href, type: a["media-type"] || "", props: a.properties || "" });
    }
    /* spine */
    const order = [];
    for (const m of opf.matchAll(/<itemref\b([^>]*)\/?>/gi)) {
      const a = attrs(m[1]);
      if (a.idref && manifest.has(a.idref)) order.push(manifest.get(a.idref));
    }
    let docs = order;
    if (!docs.length) {
      docs = [...manifest.values()].filter(it => /x?html/i.test(it.type) || /\.x?html?$/i.test(it.href));
    }
    if (!docs.length) throw new Error("EPUB 里没有可读的章节文件");

    const chapters = [];
    let i = 0;
    for (const doc of docs) {
      i++;
      const path = resolvePath(baseDir, doc.href);
      if (!entries.has(path)) continue;
      if (onProgress) onProgress(i, docs.length);
      const html = await entryText(buf, entries, path);
      const text = htmlToText(html);
      if (text.length < 20) continue;   // 封面、版权页、目录页跳过
      chapters.push({ title: titleOf(html, `第${chapters.length + 1}节`), text });
    }
    if (!chapters.length) throw new Error("没有解析出正文（可能是纯图片版 EPUB）");

    /* 书名 */
    const titleTag = opf.match(/<dc:title[^>]*>([\s\S]*?)<\/dc:title>/i);
    const title = titleTag ? decodeEntities(titleTag[1].replace(/<[^>]+>/g, "")).trim() : "";

    return { title, chapters };
  }

  /** 章节 → 规范文本（带「第N章」标记，复用现有拆章与拆书流程） */
  function toText(parsed) {
    return parsed.chapters.map((c, i) => {
      const head = new RegExp(`^第\\s*${i + 1}\\s*章`).test(c.title) ? c.title : `第${i + 1}章 ${c.title}`;
      return `${head}\n\n${c.text}`;
    }).join("\n\n");
  }

  return { parse, toText, htmlToText, supports: hasInflate };
})();

</script>
<script>
/* ============================================================
 * 书童移动版 — 参考资料库（对应桌面版 knowledge-service + LanceDB 检索）
 *
 * 桌面版用向量库做语义检索，手机上跑不动 embedding 模型，这里换成
 * 「切块 + BM25 关键词检索」：资料按段落切成 600 字左右的块，
 * 检索时用中文 2-gram + 英文词打分，取相关度最高的几块注入写稿提示词。
 * 效果不如向量，但对"查设定/查名词/找参考段落"这类需求够用，且完全离线。
 * ============================================================ */
"use strict";

window.Materials = (() => {
  const CHUNK = 620;          // 每块目标字数
  const OVERLAP = 90;         // 块间重叠，避免句子被切断后检索不到
  const MAX_TOTAL = 800000;   // 单本作品资料总量上限（字符），防止把存储撑爆

  const uid = () => "m" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  /* ---------- 切词：中文二元组 + 英文/数字词 ---------- */
  const STOP = new Set(["的了", "是在", "我们", "你们", "他们", "这个", "那个", "什么", "一个", "没有", "可以", "就是", "因为", "所以", "但是"]);

  function tokens(text) {
    const s = String(text || "").toLowerCase();
    const out = [];
    const ascii = s.match(/[a-z0-9_]+/g);
    if (ascii) for (const w of ascii) if (w.length > 1) out.push(w);
    const cjk = s.replace(/[^\u4e00-\u9fa5]/g, " ");
    for (const seg of cjk.split(/\s+/)) {
      if (!seg) continue;
      if (seg.length === 1) { out.push(seg); continue; }
      for (let i = 0; i < seg.length - 1; i++) {
        const g = seg.slice(i, i + 2);
        if (!STOP.has(g)) out.push(g);
      }
    }
    return out;
  }

  /* ---------- 切块 ---------- */
  function chunkText(text) {
    const clean = String(text || "").replace(/\r\n/g, "\n").replace(/[ \t\u3000]+/g, " ").trim();
    if (!clean) return [];
    const paras = clean.split(/\n+/).map(s => s.trim()).filter(Boolean);
    const chunks = [];
    let buf = "";
    const flush = () => { if (buf.trim()) chunks.push(buf.trim()); buf = ""; };
    for (const p of paras) {
      if (p.length >= CHUNK) {
        flush();
        for (let i = 0; i < p.length; i += CHUNK - OVERLAP) {
          const piece = p.slice(i, i + CHUNK).trim();
          if (piece) chunks.push(piece);
          if (i + CHUNK >= p.length) break;
        }
        continue;
      }
      if (buf.length + p.length + 1 > CHUNK) {
        const tail = buf.slice(-OVERLAP);
        flush();
        buf = (tail ? tail + "\n" : "") + p;
      } else {
        buf += (buf ? "\n" : "") + p;
      }
    }
    flush();
    return chunks.filter(c => c.length > 20);
  }

  /* ---------- CRUD ---------- */
  function list(novel) { return (novel && novel.materials) || []; }

  function totalChars(novel) {
    return list(novel).reduce((s, m) => s + (m.chars || 0), 0);
  }

  /**
   * 新增一份资料。返回 { material, error }
   * 超出总量上限时拒绝，避免 localStorage 降级模式下写爆。
   */
  function add(novel, { title, text, source }) {
    const clean = String(text || "").replace(/\r\n/g, "\n").trim();
    if (!clean) return { error: "内容为空" };
    if (clean.length < 40) return { error: "内容太短，至少 40 字" };
    if (totalChars(novel) + clean.length > MAX_TOTAL) {
      return { error: `资料总量会超过 ${Math.round(MAX_TOTAL / 10000)} 万字上限，先删掉一些旧资料` };
    }
    const chunks = chunkText(clean);
    if (!chunks.length) return { error: "没能切出有效段落" };
    const material = {
      id: uid(),
      title: (title || "").trim() || clean.slice(0, 16).replace(/\n/g, " "),
      source: source || "粘贴",
      addedAt: Date.now(),
      enabled: true,
      chars: clean.length,
      preview: clean.slice(0, 260),
      chunks,
    };
    if (!Array.isArray(novel.materials)) novel.materials = [];
    novel.materials.push(material);
    return { material };
  }

  function remove(novel, id) {
    if (!Array.isArray(novel.materials)) return false;
    const i = novel.materials.findIndex(m => m.id === id);
    if (i < 0) return false;
    novel.materials.splice(i, 1);
    return true;
  }

  function setEnabled(novel, id, on) {
    const m = list(novel).find(x => x.id === id);
    if (!m) return false;
    m.enabled = !!on;
    return true;
  }

  function rename(novel, id, title) {
    const m = list(novel).find(x => x.id === id);
    if (!m) return false;
    m.title = String(title || "").trim() || m.title;
    return true;
  }

  /* ---------- BM25 检索 ---------- */
  function collect(novel) {
    const rows = [];
    for (const m of list(novel)) {
      if (m.enabled === false) continue;
      for (const text of m.chunks || []) rows.push({ materialId: m.id, title: m.title, text });
    }
    return rows;
  }

  /**
   * @returns [{ text, title, materialId, score }]
   */
  function search(novel, query, k = 4) {
    const rows = collect(novel);
    if (!rows.length) return [];
    const q = [...new Set(tokens(query))];
    if (!q.length) return [];

    /* 预计算每块的词频与长度 */
    const docs = rows.map(r => {
      const tk = tokens(r.text);
      const tf = Object.create(null);
      for (const t of tk) tf[t] = (tf[t] || 0) + 1;
      return { row: r, tf, len: tk.length || 1 };
    });

    const N = docs.length;
    const avgLen = docs.reduce((s, d) => s + d.len, 0) / N;
    const df = Object.create(null);
    for (const t of q) df[t] = docs.reduce((s, d) => s + (d.tf[t] ? 1 : 0), 0);

    const k1 = 1.4, b = 0.72;
    const scored = [];
    for (const d of docs) {
      let score = 0;
      for (const t of q) {
        const f = d.tf[t] || 0;
        if (!f) continue;
        const idf = Math.log(1 + (N - df[t] + 0.5) / (df[t] + 0.5));
        score += idf * (f * (k1 + 1)) / (f + k1 * (1 - b + b * d.len / avgLen));
      }
      /* 命中的查询词越多越相关，按覆盖率加权 */
      const hit = q.filter(t => d.tf[t]).length;
      score *= 0.6 + 0.4 * (hit / q.length);
      if (score > 0) scored.push({ ...d.row, score });
    }
    if (!scored.length) return [];
    scored.sort((a, z) => z.score - a.score);

    /* 资料少的时候 BM25 的 idf 会很低，绝对阈值不可靠：
       改成"相对最高分"的截断，只有明显不相关的才丢掉 */
    const floor = Math.max(0.08, scored[0].score * 0.32);

    /* 同一份资料最多取 2 块，避免一段内容刷屏 */
    const picked = [];
    const perMat = Object.create(null);
    for (const r of scored) {
      if (r.score < floor) break;
      const c = perMat[r.materialId] || 0;
      if (c >= 2) continue;
      perMat[r.materialId] = c + 1;
      picked.push(r);
      if (picked.length >= k) break;
    }
    return picked;
  }

  /* ---------- 注入提示词的上下文块 ---------- */
  function context(novel, query, k = 4) {
    const hits = search(novel, query, k);
    if (!hits.length) return "";
    const body = hits.map((h, i) => `[${i + 1}]《${h.title}》\n${h.text}`).join("\n\n");
    return `<参考资料（从作者导入的资料库里检索到的相关段落，只作事实与用词参考，不要照抄情节）>\n${body}\n</参考资料>\n`;
  }

  function stats(novel) {
    const ms = list(novel);
    return {
      count: ms.length,
      enabled: ms.filter(m => m.enabled !== false).length,
      chunks: ms.reduce((s, m) => s + (m.chunks || []).length, 0),
      chars: totalChars(novel),
    };
  }

  return { add, remove, setEnabled, rename, list, search, context, stats, totalChars, chunkText, tokens, MAX_TOTAL };
})();

</script>
<script>
/* ============================================================
   技能库（写作审查 / 纠错插件）
   ------------------------------------------------------------
   思路对齐桌面版 src/shared/builtin-writing-skills.ts 的 SKILL 体系：
   一个技能 = 一组固定的检查视角 + 一段可改的提示词。
   技能可在设置里启停、改词、复制自建，也能在正文页一键跑。

   输出分三类：
   - issue   ：结构化问题清单（可定位原文、可勾选采纳去修稿）
   - prose   ：整段建议（教练型，不改稿）
   - blueprint：回写章纲（节拍 / 伏笔 / 张力）
   ============================================================ */
(function () {
  const KEY = "skillState";

  const GROUPS = {
    check: { name: "审查", hint: "挑毛病，不动正文" },
    fix: { name: "纠错", hint: "字句层面的硬错误" },
    craft: { name: "打磨", hint: "整体提升方向" },
    plan: { name: "章纲", hint: "拆节拍与伏笔" },
    idea: { name: "创意", hint: "卡文时给走向" },
  };

  /* ---------------- 内置技能 ---------------- */
  const BUILTIN = [
    /* ===== 审查 ===== */
    {
      id: "logic-audit", name: "逻辑硬伤", group: "check", icon: "shield", output: "issue", max: 8,
      desc: "因果断裂、动机不足、时间线冲突、常识错误",
      focus: `只找「说不通」的地方，共四类：
1. 因果断裂：前面没有铺垫，后面突然发生；或者 A 导致 B 的过程缺了一步。
2. 时间线冲突：昼夜、季节、路程、先后顺序对不上；前文说过了三天，这里说当晚。
3. 空间位置错乱：人物上一句在门外，下一句已在屋里，中间没有交代。
4. 常识错误：器物、职业、时代、生理层面经不起推敲。`,
    },
    {
      id: "continuity", name: "设定连续性", group: "check", icon: "diff", output: "issue", max: 8,
      desc: "与已定稿的事实、角色状态、世界规则撞车",
      focus: `对照「已定稿事实」和「角色当前状态」，找出正文里与之矛盾之处：
1. 人物状态矛盾：伤好了又流血、丢了的东西又拿出来、被抓了又自由行动。
2. 设定规则被破坏：世界观里定死的规则（能力上限、禁忌、地理）被随手打破。
3. 称谓与身份漂移：名字、称呼、职务、亲属关系前后不一致。
4. 已有事实被改写：前文确认过的事，这里给出另一个版本。
如果没有「已定稿事实」，就只依据角色档案与世界观判断，并说明依据。`,
    },
    {
      id: "pacing", name: "节奏诊断", group: "check", icon: "chart", output: "issue", max: 7,
      desc: "哪里拖沓、哪里赶戏、信息密度失衡",
      focus: `只评价节奏，不管文笔好坏：
1. 拖沓：连续多段没有新信息、没有冲突推进（补水词、复述已知、反复心理活动）。
2. 赶戏：重要转折一句话带过，读者来不及反应；或一章塞了太多事件。
3. 信息密度失衡：开头铺垫过久、结尾收得太急；对白段落连成一片没有停点。
4. 场景切换生硬：没有过渡就换场，读者要回头找位置。
每条要指出具体段落，并给出压缩或展开的方向。`,
    },
    {
      id: "threads", name: "伏笔呼应", group: "check", icon: "map", output: "issue", max: 7,
      desc: "该收未收、埋得太生硬、线索断掉",
      focus: `对照「未回收线索」清单检查本章：
1. 生硬埋设：伏笔直接说出来、解释一遍、生怕读者看不见。
2. 呼应缺失：本章提到前文线索却没有推进，或推进了却没有接住。
3. 断线：某条线索已连续多章未动，本章仍无提及（提示该捞起来了）。
4. 新坑无回收计划：本章新增的悬念，后文没有任何接续的余地。
若本章是收线章，反过来检查收得是否草率、代价是否足够。`,
    },
    {
      id: "motivation", name: "动机与选择", group: "check", icon: "users", output: "issue", max: 6,
      desc: "角色为什么这么做，这个选择有没有代价",
      focus: `只查人物行为是否立得住：
1. 无动机行动：角色做了某件重要的事，但读者看不出他为什么要做。
2. 性格不符：平时谨慎的人突然莽撞，冷酷的人突然心软，且没有触发事件。
3. 选择零代价：凡是选择都不痛不痒，角色没有失去任何东西。
4. 工具人化：配角只为主角提供信息或垫背，没有自己的目的。
每条要说明「按他的性格/处境，更可能怎么做」。`,
    },

      desc: "把本章蓝图拆成可勾选的节拍、待埋伏笔、张力值",
      focus: `把本章蓝图拆成可执行的写作清单。只输出一个 JSON 对象，不要任何解释：
