<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="书童移动版" />
<title>书童移动版 · AI Novel Writer</title>
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<style>
/* ============================================================
 * 书童 · 纸墨工作台 设计系统
 * 浅色=宣纸，深色=墨夜；正文用衬线，控件用无衬线
 * 性能约定：不使用 backdrop-filter（安卓 WebView 上会严重掉帧）
 * ============================================================ */
:root {
  /* 纸 */
  --bg: #f4f0e7;
  --bg-elev: #fffdf7;
  --bg-soft: #efeadf;
  --bg-sunk: #eae4d6;
  --line: #e3dbca;
  --line-strong: #d3c9b3;
  /* 墨 */
  --ink: #1b1915;
  --ink-2: #5b554a;
  --ink-3: #968e7f;
  /* 朱砂 */
  --accent: #a2402c;
  --accent-press: #8c3524;
  --accent-ink: #fffdf7;
  --accent-soft: #f6e5df;
  --ok: #3d7a52;
  --ok-soft: #e3f0e6;
  --warn: #9d671e;
  --err: #ad3729;
  /* 形 */
  --r-xl: 22px;
  --r-l: 18px;
  --r-m: 13px;
  --r-s: 10px;
  --shadow-1: 0 1px 2px rgba(27, 25, 21, .04), 0 10px 26px -18px rgba(27, 25, 21, .35);
  --shadow-2: 0 18px 48px -20px rgba(27, 25, 21, .45);
  --nav-h: 60px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  /* 字 */
  --font-ui: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --font-serif: "Songti SC", "SimSun", "Source Han Serif SC", "Noto Serif SC", Georgia, serif;
}

.dark {
  --bg: #0f1114;
  --bg-elev: #171a1f;
  --bg-soft: #1e222a;
  --bg-sunk: #23283a;
  --line: #272c35;
  --line-strong: #343a45;
  --ink: #ece7db;
  --ink-2: #a9a396;
  --ink-3: #706a5f;
  --accent: #dd8071;
  --accent-press: #c96d5e;
  --accent-ink: #1a1210;
  --accent-soft: #33231f;
  --ok: #6cbb86;
  --ok-soft: #1d2a22;
  --warn: #d5a460;
  --err: #e07264;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 26px -18px rgba(0, 0, 0, .8);
  --shadow-2: 0 18px 48px -20px rgba(0, 0, 0, .85);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.62;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
#app { min-height: 100%; display: flex; flex-direction: column; }
button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }
input, textarea, select {
  font: inherit; color: var(--ink);
  background: var(--bg-soft);
  border: 1px solid transparent;
  border-radius: var(--r-m);
  padding: 11px 13px;
  width: 100%;
  outline: none;
  transition: border-color .16s, background .16s, box-shadow .16s;
}
input::placeholder, textarea::placeholder { color: var(--ink-3); }
input:focus, textarea:focus, select:focus {
  background: var(--bg-elev);
  border-color: color-mix(in srgb, var(--accent) 55%, transparent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
textarea { resize: none; }
label {
  display: block; font-size: 12px; color: var(--ink-3);
  letter-spacing: .04em; margin: 14px 0 6px;
}
hr { border: none; border-top: 1px solid var(--line); margin: 16px 0; }
.ico { display: block; flex: none; }

/* ================= 顶栏 ================= */
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 10px;
  padding: calc(var(--safe-t) + 12px) 14px 11px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.topbar h1 {
  font-family: var(--font-serif);
  font-size: 19px; font-weight: 600; letter-spacing: .02em;
  flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.icon-btn {
  width: 36px; height: 36px; border-radius: 12px;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--ink-2); background: transparent; border: 1px solid var(--line);
  flex: none; transition: background .15s, color .15s;
}
.icon-btn:active { background: var(--bg-soft); color: var(--ink); }

/* ================= 布局 ================= */
.page { flex: 1; padding: 16px 15px calc(var(--nav-h) + var(--safe-b) + 26px); }
.card {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--r-l);
  padding: 15px;
  margin-bottom: 13px;
  box-shadow: var(--shadow-1);
}
.card h3 {
  font-size: 13px; font-weight: 600; letter-spacing: .09em;
  color: var(--ink-3); text-transform: none;
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 10px;
}
.card h3 .ico { color: var(--accent); }
.card h3 .spacer { flex: 1; }
.muted { color: var(--ink-2); font-size: 13.5px; }
.tiny { color: var(--ink-3); font-size: 11.5px; letter-spacing: .01em; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; min-width: 0; }
.section-label {
  font-size: 12px; color: var(--ink-3); letter-spacing: .12em;
  margin: 22px 4px 10px; font-weight: 600;
}

/* ================= 控件 ================= */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 40px; padding: 0 15px;
  background: var(--bg-elev); border: 1px solid var(--line);
  border-radius: var(--r-m); font-size: 14px;
  transition: transform .1s, background .15s, opacity .15s;
}
.btn:active { transform: scale(.975); }
.btn .ico { color: currentColor; }
.btn.primary {
  background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
  font-weight: 600;
}
.btn.primary:active { background: var(--accent-press); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.small { min-height: 32px; padding: 0 12px; font-size: 12.5px; border-radius: var(--r-s); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .42; pointer-events: none; }
.btn.danger { color: var(--err); border-color: color-mix(in srgb, var(--err) 32%, var(--line)); }
.tag {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; padding: 2px 9px; border-radius: 999px;
  background: var(--bg-soft); color: var(--ink-2); border: 1px solid transparent;
  letter-spacing: .02em;
}
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.accent { background: var(--accent-soft); color: var(--accent); }
.tag.err { background: color-mix(in srgb, var(--err) 13%, transparent); color: var(--err); }
.tag.warn { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 9px; }
.chip {
  padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line);
  font-size: 12.5px; background: var(--bg-elev); color: var(--ink-2);
  transition: background .15s, color .15s, border-color .15s;
}
.chip.active {
  background: var(--accent); color: var(--accent-ink);
  border-color: var(--accent); font-weight: 600;
}
.progressbar {
  height: 6px; background: var(--bg-sunk); border-radius: 999px; overflow: hidden;
}
.progressbar > div {
  height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 60%, #d99a6c));
  transition: width .35s ease;
}
.ai-output {
  white-space: pre-wrap; background: var(--bg-soft); border-radius: var(--r-m);
  padding: 12px; font-size: 14px; max-height: 40vh; overflow-y: auto;
  line-height: 1.8;
}
.field-hint { font-size: 11.5px; color: var(--ink-3); margin-top: 6px; }

/* ================= 书架 ================= */
.shelf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.book-card {
  background: var(--bg-elev); border: 1px solid var(--line);
  border-radius: var(--r-l); overflow: hidden; text-align: left;
  display: flex; flex-direction: column; box-shadow: var(--shadow-1);
  transition: transform .12s;
}
.book-card:active { transform: scale(.985); }
.book-cover {
  height: 152px; display: flex; align-items: flex-end;
  padding: 12px; color: #fff; position: relative; overflow: hidden;
  background-size: cover;
}
/* 书脊与高光，让封面有实体感 */
.book-cover::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 9px;
  background: linear-gradient(90deg, rgba(0,0,0,.35), rgba(0,0,0,0));
}
.book-cover::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0) 32%, rgba(0,0,0,.5));
}
.book-cover span {
  position: relative; z-index: 1;
  font-family: var(--font-serif); font-size: 17px; font-weight: 600; line-height: 1.35;
  letter-spacing: .02em; text-shadow: 0 1px 6px rgba(0,0,0,.4);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.book-meta { padding: 10px 12px 12px; }
.fab {
  position: fixed; right: 18px; bottom: calc(var(--nav-h) + var(--safe-b) + 20px);
  width: 54px; height: 54px; border-radius: 18px;
  background: var(--accent); color: var(--accent-ink);
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow-2); z-index: 25;
  transition: transform .12s;
}
.fab:active { transform: scale(.94); }

/* ================= 底部导航 ================= */
.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  height: calc(var(--nav-h) + var(--safe-b)); padding-bottom: var(--safe-b);
  display: flex; background: var(--bg-elev); border-top: 1px solid var(--line);
}
.bottom-nav button {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; font-size: 10.5px; color: var(--ink-3); letter-spacing: .04em;
  position: relative;
}
.bottom-nav button .ico { width: 21px; height: 21px; }
.bottom-nav button.active { color: var(--accent); font-weight: 600; }
/* 选中态：图标上方的短横线，比整块高亮更克制 */
.bottom-nav button.active::after {
  content: ""; position: absolute; top: 7px; width: 18px; height: 2.5px;
  border-radius: 999px; background: var(--accent);
}

/* ================= 章节列表 / 编辑器 ================= */
.chapter-item {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 2px; border-bottom: 1px solid var(--line);
  text-align: left; width: 100%;
}
.chapter-item:last-child { border-bottom: none; }
.chapter-item .no {
  font-family: var(--font-serif); font-size: 13px; color: var(--ink-3);
  width: 26px; flex: none; text-align: right;
}
.chapter-item .t { flex: 1; min-width: 0; }
.chapter-item .t .name {
  display: block; font-size: 15px; letter-spacing: .01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.chapter-item .t .sub { display: block; font-size: 11.5px; color: var(--ink-3); margin-top: 1px; }
.editor-wrap { display: flex; flex-direction: column; gap: 10px; }
.editor-area {
  /* 固定高度 + 内部滚动：避免每次输入都重排整页（原实现每次都量 scrollHeight） */
  height: calc(100dvh - 250px);
  min-height: 260px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  font-family: var(--editor-font, var(--font-serif));
  font-size: var(--editor-size, 17.5px); line-height: var(--editor-lh, 2); letter-spacing: .012em;
  border: none; background: transparent; padding: 2px 2px 24px;
  border-radius: 0;
  box-shadow: none;
}
.editor-area:focus { border: none; box-shadow: none; background: transparent; }
.editor-toolbar {
  position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + var(--safe-b));
  z-index: 20;
  padding: 9px 12px 10px;
  background: var(--bg); border-top: 1px solid var(--line);
}
/* 主操作一行（写/续/润/审），次要操作一行（修/定稿/历史），不再横向滚动截断 */
.et-row { display: flex; gap: 7px; }
.et-row + .et-row { margin-top: 7px; }
.et-row .btn { flex: 1 1 0; min-width: 0; padding-left: 4px; padding-right: 4px; }
.et-row .btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ================= 蓝图 ================= */
.bp-item {
  border-left: 2px solid var(--line); padding: 9px 0 9px 13px; margin-left: 5px;
}
.bp-item.active { border-left-color: var(--accent); }
.bp-item .name { font-weight: 600; font-size: 14.5px; }
.bp-item .sub {
  font-size: 12.5px; color: var(--ink-2); margin-top: 3px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}

/* ================= 空状态 ================= */
.empty { text-align: center; color: var(--ink-2); padding: 56px 24px; }
.empty .big {
  width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 24px;
  background: var(--bg-elev); border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  color: var(--accent); box-shadow: var(--shadow-1);
}
.empty .big svg { width: 34px; height: 34px; }
.empty .e-title { font-family: var(--font-serif); font-size: 16px; color: var(--ink); margin-bottom: 6px; }
.empty .e-hint { font-size: 12.5px; color: var(--ink-3); line-height: 1.8; }

/* ================= 弹层 / Toast / 运行条 ================= */
.sheet-mask {
  position: fixed; inset: 0; background: rgba(18, 15, 11, .5); z-index: 50;
  display: flex; align-items: flex-end; animation: fadeIn .18s;
}
.sheet {
  width: 100%; max-height: 88vh; overflow-y: auto;
  background: var(--bg-elev);
  border-radius: var(--r-xl) var(--r-xl) 0 0;
  padding: 10px 16px calc(18px + var(--safe-b));
  box-shadow: var(--shadow-2);
  animation: slideUp .24s cubic-bezier(.2, .8, .3, 1);
}
.sheet h3 {
  font-family: var(--font-serif); font-size: 17px; font-weight: 600;
  margin: 8px 0 4px; letter-spacing: .02em;
  display: flex; align-items: center; gap: 7px;
}
.sheet h3 .ico { color: var(--accent); }
.sheet.grab { width: 36px; height: 4px; border-radius: 999px; background: var(--line-strong); margin: 0 auto 12px; }
@keyframes slideUp { from { transform: translateY(28%); opacity: .5; } to { transform: none; opacity: 1; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

#toast-layer {
  position: fixed; top: calc(var(--safe-t) + 80px); left: 0; right: 0; z-index: 90;
  display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
}
.toast {
  background: var(--ink); color: var(--bg-elev);
  padding: 10px 17px; border-radius: 14px;
  font-size: 13px; max-width: 86vw; text-align: center;
  box-shadow: var(--shadow-2); animation: fadeIn .2s;
}
.toast.err { background: var(--err); color: #fff; }

.run-bar {
  position: fixed; left: 12px; right: 12px;
  bottom: calc(var(--nav-h) + var(--safe-b) + 10px); z-index: 40;
  background: var(--bg-elev); border: 1px solid var(--line);
  border-radius: var(--r-l); box-shadow: var(--shadow-2);
  padding: 11px 13px; display: flex; align-items: center; gap: 11px;
  animation: slideUp .2s;
}
.run-bar .info { flex: 1; min-width: 0; }
.run-bar .info .t { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.run-bar .info .s { font-size: 11.5px; color: var(--ink-3); }
.pulse {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent); animation: pulse 1.1s infinite;
}
@keyframes pulse { 50% { opacity: .25; } }

/* 作品概览条 */
.stat-bar {
  display: flex; align-items: baseline; gap: 10px;
  font-size: 11.5px; color: var(--ink-3); letter-spacing: .04em;
}
.stat-bar b {
  font-family: var(--font-serif); font-size: 15px; color: var(--ink); font-weight: 600;
  margin-right: 2px;
}

/* 编辑区底部留白，避免被工具栏遮住 */
.page.editor-page { padding-bottom: calc(var(--nav-h) + var(--safe-b) + 62px); }

/* ================= 角色 ================= */
.avatar {
  flex: none; width: 38px; height: 38px; border-radius: 13px;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent-soft); color: var(--accent);
  font-family: var(--font-serif); font-size: 17px; font-weight: 600;
}
.clamp1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chapter-item .t .name { display: flex; align-items: center; gap: 6px; }

/* ================= 审稿勾选 ================= */
.rv-item {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 11px 12px; border: 1px solid var(--line); border-radius: var(--r-m);
  margin-bottom: 8px; background: var(--bg-elev); cursor: pointer;
}
.rv-item input[type="checkbox"] {
  flex: none; width: 18px; height: 18px; margin-top: 2px;
  accent-color: var(--accent); border-radius: 5px;
}

/* ================= 沉浸写作 ================= */
.immersive-exit { display: none; }
body.immersive .topbar,
body.immersive .editor-toolbar,
body.immersive .bottom-nav { display: none; }
body.immersive .page.editor-page { padding: 10px 12px 16px; }
body.immersive .editor-area { height: calc(100dvh - 96px); }
body.immersive .immersive-exit {
  display: inline-flex; align-items: center; gap: 4px;
  position: fixed; right: 14px; bottom: calc(var(--safe-b) + 16px); z-index: 60;
  padding: 7px 12px; border-radius: 999px; font-size: 11.5px;
  background: var(--bg-elev); color: var(--ink-3);
  border: 1px solid var(--line-strong); box-shadow: var(--shadow-2);
  opacity: .92;
}

/* ================= 通用弹层结构（新功能共用） ================= */
.sheet-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sheet-head .btn { flex: none; }
.sheet-scroll { max-height: 58vh; overflow-y: auto; -webkit-overflow-scrolling: touch; margin-top: 6px; }
.preview-paper {
  margin-top: 12px; padding: 12px 14px; border: 1px dashed var(--line-strong);
  border-radius: var(--r-m); background: var(--bg);
  font-family: var(--editor-font, var(--font-serif));
  font-size: var(--editor-size, 17.5px); line-height: var(--editor-lh, 2);
  color: var(--ink-2);
}

/* ================= 历史版本 ================= */
.ver-row {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 2px; border-bottom: 1px solid var(--line);
}
.ver-row .no {
  flex: none; width: 30px; font-size: 11px; color: var(--ink-3);
  font-family: var(--font-serif);
}
.ver-row .t { flex: 1; min-width: 0; }
.ver-row .t .name { display: block; font-size: 13.5px; }
.ver-row .t .sub { display: block; font-size: 11.5px; color: var(--ink-3); margin-top: 1px; }
.ver-row .btn { flex: none; }

/* ================= 逐段合并 ================= */
.mg-list { max-height: 50vh; overflow-y: auto; -webkit-overflow-scrolling: touch; margin-top: 8px; }
.mg-same {
  font-size: 12.5px; color: var(--ink-3); padding: 6px 2px;
  white-space: pre-wrap; line-height: 1.7;
}
.mg-hunk {
  border: 1px solid var(--line); border-radius: var(--r-m);
  background: var(--bg); margin: 8px 0; padding: 8px; position: relative;
}
.mg-choice {
  border: 1px solid transparent; border-radius: var(--r-s);
  padding: 7px 9px; cursor: pointer; margin-bottom: 5px;
}
.mg-choice:last-of-type { margin-bottom: 0; }
.mg-choice.active { border-color: var(--accent); background: var(--accent-soft); }
.mg-tag {
  display: inline-block; font-size: 10px; letter-spacing: .08em;
  color: var(--ink-3); margin-bottom: 3px;
}
.mg-choice.active .mg-tag { color: var(--accent); font-weight: 600; }
.mg-text {
  font-family: var(--font-serif); font-size: 13.5px; line-height: 1.75;
  white-space: pre-wrap; max-height: 6.4em; overflow-y: auto; color: var(--ink-2);
}
.mg-choice.active .mg-text { color: var(--ink); }
.mg-textarea {
  width: 100%; border: none; background: transparent; padding: 0;
  font-family: var(--font-serif); font-size: 13.5px; line-height: 1.75;
  color: var(--ink); resize: vertical;
}
.mg-textarea:focus { box-shadow: none; border: none; }
.mg-edit {
  position: absolute; right: 6px; top: 6px; padding: 3px 8px;
  font-size: 10.5px; opacity: .7;
}

/* ================= 逐字对比 ================= */
.df-head {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 8px 0; border-bottom: 1px solid var(--line);
}
.df-body {
  max-height: 62vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  font-family: var(--font-serif); font-size: 14px; line-height: 1.9;
  padding: 8px 0;
}
.df-same { color: var(--ink-3); padding: 3px 0; white-space: pre-wrap; }
.df-same-fold {
  color: var(--ink-3); font-size: 11px; text-align: center;
  padding: 4px 0; letter-spacing: .06em;
}
.df-change {
  white-space: pre-wrap; padding: 7px 10px; margin: 6px 0;
  border-left: 2px solid var(--line-strong); background: var(--bg);
  border-radius: 0 var(--r-s) var(--r-s) 0;
}
.df-change del {
  background: #f7dfda; color: #8c3524; text-decoration: line-through;
  text-decoration-thickness: 1px;
}
.df-change ins {
  background: #dcefe2; color: #2c6040; text-decoration: none;
}
.dark .df-change del { background: #3a2320; color: #e79c90; }
.dark .df-change ins { background: #1e2f24; color: #8fc9a3; }

/* ================= 关系图谱 ================= */
#gp-canvas { margin: 6px 0; }
.gp-legend {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 6px 0; border-top: 1px solid var(--line);
}
.gp-lg, .gp-rel {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; color: var(--ink-2);
}
.gp-lg i, .gp-rel i {
  width: 8px; height: 8px; border-radius: 999px; display: inline-block;
}
.gp-rel { margin: 4px 10px 0 0; }
.gp-rel i { width: 6px; height: 6px; }

/* ================= 命令面板 ================= */
.palette { padding-top: 2px; }
.palette input {
  width: 100%; padding: 11px 13px; font-size: 15px;
  border-radius: var(--r-m); background: var(--bg);
}
.cp-list { max-height: 56vh; overflow-y: auto; margin-top: 8px; }
.cp-item {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 10px 8px; border-radius: var(--r-m); background: transparent;
  border: none; text-align: left; color: var(--ink);
}
.cp-item:active { background: var(--bg-soft); }
.cp-ico {
  flex: none; width: 28px; height: 28px; border-radius: 9px;
  display: grid; place-items: center;
  background: var(--bg-soft); color: var(--accent);
}
.cp-item .t { flex: 1; min-width: 0; }
.cp-item .name { display: block; font-size: 13.5px; }
.cp-item .sub {
  display: block; font-size: 11.5px; color: var(--ink-3); margin-top: 1px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* ================= 提示词编辑 ================= */
.prompt-edit {
  min-height: 34vh; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
  font-size: 12.5px; line-height: 1.7; white-space: pre-wrap;
}

/* ================= 细节修正 ================= */
/* 原生滑块默认是系统蓝，与纸墨色系不搭 */
input[type="range"] {
  accent-color: var(--accent);
  height: 22px; padding: 0; border: none; background: transparent;
  box-shadow: none;
}
input[type="range"]:focus { border: none; box-shadow: none; }
input[type="checkbox"] { accent-color: var(--accent); }
/* 合并按钮常驻底部，长章节也不用滚到底才能点 */
#mg-apply {
  position: sticky; bottom: calc(-18px - var(--safe-b)); z-index: 3;
  background: var(--accent); box-shadow: 0 -10px 18px -12px rgba(27, 25, 21, .5);
  margin-top: 10px;
}

/* ============================================================
   AI 模式开关（创作 / 辅助）
   ============================================================ */
.tb-actions { display: flex; align-items: center; gap: 6px; flex: none; }
.mode-pill {
  display: inline-flex; align-items: center; gap: 5px; height: 30px;
  padding: 0 10px 0 8px; border-radius: 999px; flex: none;
  border: 1px solid var(--line-strong); background: var(--bg-elev);
  color: var(--ink-2); font-size: 11.5px; font-weight: 600;
  letter-spacing: .02em; transition: background .16s, color .16s, border-color .16s;
}
.mode-pill i {
  width: 6px; height: 6px; border-radius: 999px; background: var(--ink-3); flex: none;
}
.mode-pill.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.mode-pill.on i { background: var(--accent); box-shadow: 0 0 0 3px rgba(162, 64, 44, .12); }
.mode-pill.off { color: var(--ok); border-color: var(--line-strong); }
.mode-pill.off i { background: var(--ok); }
.mode-pill:active { transform: scale(.97); }
/* 辅助模式下，生成类按钮压暗（点了会提示切模式，不会偷偷生成） */
body.assist-mode [data-gen] { opacity: .42; }

/* ============================================================
   码字仪表悬浮窗
   ============================================================ */
.wb-hud {
  position: fixed; z-index: 40;
  top: calc(var(--safe-t) + 66px); right: 12px;
  -webkit-user-select: none; user-select: none;
  touch-action: none;
  transition: opacity .18s;
}
.wb-hud.dragging { transition: none; }
.wb-pill {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 12px 7px 10px; border-radius: 16px;
  background: var(--bg-elev); border: 1px solid var(--line);
  box-shadow: var(--shadow-1); color: var(--ink);
  text-align: left;
}
.wb-pill:active { border-color: var(--line-strong); }
.wb-lead { display: grid; place-items: center; width: 14px; flex: none; }
.wb-lead i {
  width: 7px; height: 7px; border-radius: 999px; background: var(--ink-3);
  transition: background .2s, box-shadow .2s;
}
.wb-hud.typing .wb-lead i { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.wb-hud.idle-warn .wb-lead i { background: var(--warn); box-shadow: 0 0 0 4px rgba(157, 103, 30, .14); }
.wb-hud.paused .wb-lead i { background: var(--line-strong); }
.wb-body { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.wb-l1 { display: flex; align-items: baseline; gap: 3px; line-height: 1.1; }
.wb-l1 b {
  font-family: var(--font-serif); font-size: 16px; font-weight: 600;
  color: var(--ink); font-variant-numeric: tabular-nums;
}
.wb-l1 em { font-style: normal; font-size: 9.5px; color: var(--ink-3); letter-spacing: .02em; }
.wb-l2 {
  font-size: 10px; color: var(--ink-3); line-height: 1.2;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.wb-hud.idle-warn .wb-l2 { color: var(--warn); }

/* 展开面板 */
.wb-panel {
  position: absolute; top: calc(100% + 8px); right: 0;
  width: 244px; padding: 13px 14px 12px;
  background: var(--bg-elev); border: 1px solid var(--line);
  border-radius: var(--r-l); box-shadow: var(--shadow-2);
  animation: fadeIn .14s;
}
.wb-ph {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 10.5px; letter-spacing: .12em; color: var(--ink-3);
  text-transform: uppercase;
}
.wb-x {
  width: 22px; height: 22px; border-radius: 8px; border: none;
  background: transparent; color: var(--ink-3); font-size: 16px; line-height: 1;
}
.wb-grid {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;
  margin: 11px 0 12px;
}
.wb-grid div { display: flex; flex-direction: column; gap: 2px; }
.wb-grid b {
  font-family: var(--font-serif); font-size: 15px; font-weight: 600;
  color: var(--ink); font-variant-numeric: tabular-nums;
}
.wb-grid b.warm { color: var(--warn); }
.wb-grid span { font-size: 9.5px; color: var(--ink-3); }
.wb-day { padding-top: 2px; }
.wb-day-h { display: flex; align-items: baseline; justify-content: space-between; }
.wb-day-h span { font-size: 10.5px; color: var(--ink-3); letter-spacing: .08em; }
.wb-day-h b { font-family: var(--font-serif); font-size: 14px; font-weight: 600; }
.wb-bar {
  height: 3px; border-radius: 999px; background: var(--bg-sunk);
  margin: 7px 0 6px; overflow: hidden;
}
.wb-bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s; }
.wb-day-f { font-size: 9.5px; color: var(--ink-3); line-height: 1.5; font-variant-numeric: tabular-nums; }
.wb-spark-cap {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-top: 12px;
}
.wb-spark-cap span { font-size: 9.5px; color: var(--ink-3); letter-spacing: .04em; }
.wb-spark-cap b { font-size: 9.5px; font-weight: 500; color: var(--ink-3); }
.wb-spark {
  display: flex; align-items: flex-end; gap: 3px; height: 38px;
  margin: 5px 0 4px; padding-top: 2px; position: relative;
}
.wb-spark i {
  flex: 1; min-height: 2px; border-radius: 2px 2px 0 0;
  background: var(--line-strong);
}
.wb-spark i.now { background: var(--accent); }
.wb-acts { display: flex; gap: 6px; margin-top: 9px; }
.wb-acts button {
  flex: 1; padding: 7px 0; border-radius: 9px; font-size: 11px;
  border: 1px solid var(--line); background: transparent; color: var(--ink-2);
}
.wb-acts button:active { background: var(--bg-soft); }

/* 沉浸模式：只留纸与仪表，仪表稍微淡一点不抢戏 */
.wb-hud.muted { opacity: .52; }
.wb-hud.open, .wb-hud.dragging { opacity: 1; }
body.immersive .wb-hud { opacity: .82; }
body.immersive .wb-hud.muted { opacity: .5; }
body.assist-mode .wb-hud { opacity: .96; }

/* ============================================================
   章纲罗盘（正文页第二个悬浮窗）
   ============================================================ */
.cp-hud {
  position: fixed; z-index: 41;
  top: calc(var(--safe-t) + 118px); right: 12px;
  -webkit-user-select: none; user-select: none;
  touch-action: none;
  max-width: calc(100vw - 24px);
}
.cp-hud.dragging { transition: none; }
.cp-hud.dragging .cp-panel { display: none; }

.cp-pill {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 9px 6px 10px; border-radius: 14px;
  background: var(--bg-elev); border: 1px solid var(--line);
  box-shadow: var(--shadow-1); color: var(--ink); text-align: left;
  touch-action: none;
}
.cp-pill:active { border-color: var(--line-strong); }
.cp-dot {
  width: 7px; height: 7px; border-radius: 999px; flex: none;
  background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
}
.cp-pl { font-size: 11px; color: var(--ink-2); letter-spacing: .04em; }
.cp-pn {
  font-family: var(--font-serif); font-size: 13px; font-weight: 600;
  color: var(--ink); font-variant-numeric: tabular-nums;
}
.cp-x {
  font-size: 14px; line-height: 1; color: var(--ink-3);
  padding: 0 1px 0 3px; opacity: .55;
}
.cp-x:active { opacity: 1; color: var(--err, #a2402c); }
.cp-hud.open .cp-pill { border-color: var(--accent); }

.cp-panel {
  position: absolute; top: calc(100% + 8px); right: 0;
  width: 272px; max-width: calc(100vw - 24px);
  max-height: 64vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: var(--bg-elev); border: 1px solid var(--line);
  border-radius: var(--r-l); box-shadow: var(--shadow-2);
  animation: fadeIn .13s; padding: 11px 13px 12px;
}
.cp-tabs {
  display: flex; align-items: center; gap: 4px;
  padding-bottom: 8px; border-bottom: 1px solid var(--line);
}
.cp-tab {
  padding: 4px 9px; border-radius: 8px; border: 1px solid transparent;
  background: transparent; color: var(--ink-3); font-size: 11.5px;
}
.cp-tab.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 600; }
.cp-ch { margin-left: auto; font-size: 10.5px; color: var(--ink-3); letter-spacing: .06em; }

.cp-sec { padding: 9px 0; border-bottom: 1px solid var(--line); }
.cp-sec:last-of-type { border-bottom: none; }
.cp-h {
  display: flex; align-items: center; gap: 6px;
  font-size: 10px; letter-spacing: .1em; color: var(--ink-3);
  text-transform: uppercase; margin-bottom: 6px;
}
.cp-h em { font-style: normal; margin-left: auto; color: var(--ink-3); letter-spacing: 0; }
.cp-mini {
  margin-left: auto; font-size: 10px; padding: 2px 7px;
  border-radius: 6px; border: 1px solid var(--line);
  background: transparent; color: var(--ink-3);
}
.cp-mini:active { background: var(--bg-soft); color: var(--ink); }

.cp-goal { font-size: 12.5px; line-height: 1.6; color: var(--ink); }
.cp-events {
  font-size: 11.5px; line-height: 1.65; color: var(--ink-2);
  margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
  overflow: hidden;
}
.cp-hook {
  display: flex; gap: 5px; align-items: flex-start;
  margin-top: 6px; padding: 5px 7px; border-radius: 7px;
  background: var(--accent-soft); font-size: 11.5px; line-height: 1.5; color: var(--accent);
}
.cp-hook i {
  font-style: normal; font-size: 9px; flex: none;
  border: 1px solid currentColor; border-radius: 3px; padding: 0 2px; line-height: 1.3;
}
.cp-empty { font-size: 11.5px; line-height: 1.6; color: var(--ink-3); }

.cp-wordrow { display: flex; align-items: baseline; gap: 3px; }
.cp-wordrow b {
  font-family: var(--font-serif); font-size: 17px; font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.cp-wordrow span { font-size: 10px; color: var(--ink-3); }
.cp-wordrow em { margin-left: auto; font-style: normal; font-size: 10.5px; color: var(--ink-3); }
.cp-wordrow em.ok { color: var(--ok, #3e7d4f); }
.cp-bar { height: 3px; border-radius: 999px; background: var(--bg-sunk); margin-top: 6px; overflow: hidden; }
.cp-bar i { display: block; height: 100%; border-radius: 999px; background: var(--accent); transition: width .3s; }

.cp-beats, .cp-ths { display: flex; flex-direction: column; gap: 2px; }
.cp-beat, .cp-th {
  display: flex; align-items: flex-start; gap: 7px;
  padding: 5px 2px; border-radius: 7px; cursor: pointer;
}
.cp-beat:active, .cp-th:active { background: var(--bg-soft); }
.cp-cb {
  flex: none; width: 14px; height: 14px; margin-top: 1px;
  border: 1px solid var(--line-strong); border-radius: 4px;
  display: grid; place-items: center; font-size: 9px; line-height: 1;
  color: transparent; background: var(--bg);
}
.cp-cb.sm { width: 12px; height: 12px; border-radius: 999px; }
.cp-beat.done .cp-cb { background: var(--accent); border-color: var(--accent); color: #fff; }
.cp-th.done .cp-cb { background: var(--accent); border-color: var(--accent); color: #fff; }
.cp-bt { font-size: 12px; line-height: 1.5; color: var(--ink); }
.cp-beat.done .cp-bt { color: var(--ink-3); text-decoration: line-through; text-decoration-thickness: 1px; }
.cp-th { align-items: center; }
.cp-tt { flex: 1; min-width: 0; font-size: 11.5px; line-height: 1.5; color: var(--ink-2); }
.cp-th.done .cp-tt { color: var(--ink-3); text-decoration: line-through; }
.cp-th.warn .cp-tt { color: var(--warn, #9d671e); }
.cp-th.warn .cp-tt i { font-style: normal; font-size: 10px; opacity: .8; margin-left: 5px; }
.cp-th .cp-mini { flex: none; margin-left: 0; }

.cp-stars { display: flex; gap: 3px; }
.cp-star {
  border: none; background: transparent; padding: 1px 2px;
  font-size: 11px; line-height: 1; color: var(--line-strong);
}
.cp-star.on { color: var(--accent); }

.cp-acts { display: flex; gap: 6px; padding-top: 10px; }
.cp-btn {
  flex: 1; padding: 8px 0; border-radius: 9px; font-size: 11.5px;
  border: 1px solid var(--line); background: transparent; color: var(--ink-2);
}
.cp-btn:first-child { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.cp-btn:active { opacity: .75; }
.cp-btn:disabled { opacity: .5; }

.cp-outline { font-size: 12px; line-height: 1.65; color: var(--ink); white-space: pre-wrap; }
.cp-list { display: flex; flex-direction: column; gap: 1px; }
.cp-row {
  display: flex; gap: 8px; align-items: flex-start; width: 100%;
  padding: 6px 4px; border: none; background: transparent; text-align: left;
  border-radius: 7px;
}
.cp-row:active { background: var(--bg-soft); }
.cp-row.cur { background: var(--accent-soft); }
.cp-no {
  flex: none; width: 18px; font-size: 10px; color: var(--ink-3);
  font-family: var(--font-serif); text-align: right; padding-top: 1px;
}
.cp-row.cur .cp-no { color: var(--accent); font-weight: 600; }
.cp-t { flex: 1; min-width: 0; font-size: 11.5px; line-height: 1.45; color: var(--ink); }
.cp-t i {
  display: block; font-style: normal; font-size: 10.5px; color: var(--ink-3);
  margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* 沉浸模式：罗盘淡一点 */
body.immersive .cp-hud { opacity: .86; }
body.immersive .cp-hud.open { opacity: 1; }

/* ============================================================
   技能库
   ============================================================ */
.sk-group { margin-top: 12px; }
.sk-group:first-child { margin-top: 2px; }
.sk-gh {
  display: flex; align-items: baseline; gap: 7px;
  padding: 0 2px 6px;
}
.sk-gh span { font-size: 11px; font-weight: 600; letter-spacing: .1em; color: var(--ink-2); }
.sk-gh em { font-style: normal; font-size: 10.5px; color: var(--ink-3); }

.sk-item {
  display: flex; align-items: stretch; gap: 4px;
  border: 1px solid var(--line); border-radius: var(--r-m);
  background: var(--bg); margin-bottom: 6px; overflow: hidden;
}
.sk-item.off { opacity: .5; }
.sk-main {
  flex: 1; min-width: 0; display: flex; align-items: flex-start; gap: 9px;
  padding: 10px 4px 10px 10px; border: none; background: transparent;
  text-align: left; color: var(--ink);
}
.sk-main:active { background: var(--bg-soft); }
.sk-ico {
  flex: none; width: 26px; height: 26px; border-radius: 8px;
  display: grid; place-items: center;
  background: var(--bg-soft); color: var(--accent);
}
.sk-t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.sk-t b { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
.sk-t span { font-size: 11.5px; line-height: 1.5; color: var(--ink-3); }
.sk-tag {
  font-style: normal; font-size: 9px; font-weight: 500; letter-spacing: .04em;
  padding: 1px 4px; border-radius: 4px;
  border: 1px solid var(--line-strong); color: var(--ink-3);
}
.sk-tag.new { border-color: var(--accent); color: var(--accent); }
.sk-more {
  flex: none; width: 38px; border: none; background: transparent;
  color: var(--ink-3); display: grid; place-items: center;
}
.sk-more:active { background: var(--bg-soft); color: var(--ink); }

.sk-cnt { margin-left: auto; display: flex; gap: 4px; }

/* 问题清单 */
.sk-report { max-height: 56vh; overflow-y: auto; -webkit-overflow-scrolling: touch; margin-top: 8px; }
.sk-rv {
  display: flex; align-items: flex-start; gap: 9px;
  padding: 10px 0; border-bottom: 1px solid var(--line);
}
.sk-rv input[type="checkbox"] { margin-top: 3px; flex: none; }
.sk-rv-body { flex: 1; min-width: 0; }
.sk-rv-h { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sk-locate {
  margin-left: auto; font-size: 10.5px; padding: 2px 8px;
  border-radius: 6px; border: 1px solid var(--line-strong);
  background: transparent; color: var(--ink-2);
}
.sk-locate:active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.sk-quote {
  margin-top: 6px; padding: 5px 8px; border-left: 2px solid var(--line-strong);
  background: var(--bg-soft); border-radius: 0 5px 5px 0;
  font-family: var(--font-serif); font-size: 12.5px; line-height: 1.6;
  color: var(--ink-2);
}
.sk-comment { margin-top: 6px; font-size: 13px; line-height: 1.6; color: var(--ink); }
.sk-fix {
  margin-top: 4px; font-size: 12px; line-height: 1.6;
  color: var(--ok, #3e7d4f);
}
.dark .sk-fix { color: #8fc9a3; }

/* 教练型输出 */
.md-body {
  max-height: 56vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  margin-top: 10px; padding-right: 2px;
}
.md-h {
  font-size: 13px; font-weight: 600; margin: 14px 0 6px;
  color: var(--ink); letter-spacing: .02em;
}
.md-h:first-child { margin-top: 0; }
.md-p { font-size: 13.5px; line-height: 1.75; margin: 5px 0; color: var(--ink-2); }
.md-ul { margin: 5px 0 5px 2px; padding-left: 16px; }
.md-ul li { font-size: 13.5px; line-height: 1.75; color: var(--ink-2); margin: 3px 0; }
.md-q {
  margin: 7px 0; padding: 6px 10px; border-left: 2px solid var(--accent);
  background: var(--accent-soft); border-radius: 0 6px 6px 0;
  font-family: var(--font-serif); font-size: 13px; line-height: 1.7; color: var(--ink);
}

/* 节拍内联新增 */
.cp-addrow { display: flex; gap: 5px; align-items: center; margin-top: 4px; }
.cp-input {
  flex: 1; min-width: 0; padding: 6px 8px; font-size: 12px;
  border-radius: 7px; border: 1px solid var(--line-strong);
  background: var(--bg); color: var(--ink);
}
.cp-input:focus { border-color: var(--accent); box-shadow: none; }

/* 修正：全局 input 是 width:100%，勾选框与内联输入需要显式回收宽度 */
.sk-rv input[type="checkbox"] {
  width: 17px; height: 17px; padding: 0; margin-top: 3px;
  flex: none; border-radius: 5px;
}
.cp-input { width: auto; padding: 6px 8px; }
.cp-addrow .cp-mini { margin-left: 0; flex: none; padding: 5px 9px; }

/* 罗盘展开时的透明遮罩：点空白处收起，不用再找胶囊 */
.cp-scrim { position: fixed; inset: 0; background: transparent; z-index: 0; }
.cp-pill { position: relative; z-index: 2; }
.cp-panel { z-index: 2; }
.cp-scrim { position: fixed; inset: 0; z-index: 40; background: transparent; }

/* ============================================================
   章节行内操作 / 线索时间线 / 资料库
   ============================================================ */
.chapter-row { display: flex; align-items: center; gap: 2px; border-bottom: 1px solid var(--line); }
.chapter-row:last-child { border-bottom: none; }
.chapter-row .chapter-item { flex: 1; min-width: 0; border-bottom: none; }
.ch-more {
  flex: none; width: 34px; height: 40px; border: none; background: transparent;
  color: var(--ink-3); display: grid; place-items: center; border-radius: 8px;
}
.ch-more:active { background: var(--bg-soft); color: var(--ink); }

/* 线索时间线 */
.tl-axis {
  display: flex; justify-content: space-between;
  font-size: 9.5px; color: var(--ink-3); letter-spacing: .04em;
  padding-bottom: 6px; border-bottom: 1px dashed var(--line);
  margin-bottom: 6px;
}
.tl-row { padding: 7px 0; }
.tl-label {
  display: flex; align-items: baseline; gap: 6px;
  font-size: 12.5px; color: var(--ink); margin-bottom: 5px;
}
.tl-label span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-label i { font-style: normal; font-size: 10px; color: var(--ink-3); flex: none; }
.tl-label.warn { color: var(--warn); }
.tl-label.warn i { color: var(--warn); }
.tl-track {
  position: relative; height: 8px; border-radius: 999px;
  background: var(--bg-sunk);
}
.tl-bar {
  position: absolute; top: 2px; height: 4px; border-radius: 999px;
  background: var(--accent-soft); border: 1px solid var(--accent);
}
.tl-dot {
  position: absolute; top: 50%; width: 8px; height: 8px; margin-left: -4px;
  transform: translateY(-50%); border-radius: 999px; display: inline-block;
}
.tl-dot.plant { background: var(--accent); }
.tl-dot.move { background: var(--bg-elev); border: 1.5px solid var(--accent); }
.tl-dot.done { background: var(--ok, #3e7d4f); }
.tl-legend {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line);
  font-size: 10.5px; color: var(--ink-3);
}
.tl-legend span { display: inline-flex; align-items: center; gap: 4px; position: relative; }
.tl-legend .tl-dot { position: static; transform: none; margin: 0; width: 7px; height: 7px; }
.tl-legend em { font-style: normal; }

</style>

/* ============================================================

/* 生成 svg 字符串。more 用实心点，其余一律描边 */
function svgIcon(name, size = 20, cls = "ico") {
  const path = ICONS[name] || ICONS.doc;
  const solid = name === "more";
  return `<svg class="${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" ` +
    (solid ? 'fill="currentColor"' : 'fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"') +
    ` aria-hidden="true">${path}</svg>`;
}

<script>
/* ============================================================
 * 书童移动版 — Prompt 模板体系
 * 仿照桌面版 src/services/builtin-prompt-templates.ts 的三级模板
 * 思想：{{变量}} 插值 + 系统合同（输出格式约束）不可编辑。
 * ============================================================ */

const SYSTEM_CONTRACT = [
  "你是一位资深中文长篇小说写作助手。",

  "1. 只输出被要求的内容，不要输出解释、前言、致歉或重复指令。",
  "2. 内容必须与给定的人物、世界观、前情保持一致，不得擅自增加主线设定。",
  "3. 使用给定作品设定的写作语言与文风。",
  "4. 需要输出 JSON 时，输出裸 JSON（不带 ``` 代码块标记、不带注释）。",
].join("\n");

const T = {
  /* ---------- 设定（NovelConfig 逐字段生成） ---------- */
  infer_novel_config: {
    system: SYSTEM_CONTRACT,
    task: `根据作者的一句话构想，为长篇小说补全创作设定。作者构想：
<idea>{{idea}}</idea>

输出 JSON（字段值用中文，totalChapters 为 20-300 的整数，wordsPerChapter 为 1000-6000 的整数）：
{
 "name": "书名（简短有辨识度）",
 "genre": "题材，如 都市、玄幻、悬疑、科幻、历史、言情",
 "subGenre": "细分题材",
 "targetAudience": "目标读者",
 "totalChapters": 100,
 "wordsPerChapter": 2500,
 "plotStructure": "one of: three_act | heros_journey | save_the_cat | kishotenketsu | multi_thread | freeform",
 "narrativePOV": "one of: third_limited | first_person | third_omniscient | multi_pov",
 "coreOutline": "一句话故事前提（50-120字）",
 "worldSetting": "世界观概述（150-300字）",
 "goldenFinger": "主角的金手指/核心优势（50-150字）",
 "protagonistProfile": "主角小传（80-200字）",
 "writingStyle": "文风要求（30-80字）",
 "globalGuidance": "全局写作指导（30-80字）"
}`,
    vars: ["idea"],

  /* ---------- 架构四节 ---------- */
  premise: {
    system: SYSTEM_CONTRACT,
    task: `基于以下作品设定，撰写【故事前提】：把设定中的构想扩展为 300-600 字的故事梗概，写清主角起点、核心冲突、金手指如何介入、故事的走向与情感底色。

<设定>
{{config}}
</设定>`,

  character_dynamics: {
    system: SYSTEM_CONTRACT,
    task: `基于以下作品设定与故事前提，设计主要角色名单（4-8人，含主角）。输出 JSON 数组：
[{
 "name":"姓名","role":"protagonist|supporting|antagonist|minor","gender":"","age":"",
 "appearance":"外貌 20-60字","personality":"性格 30-80字","background":"背景 50-150字",

}]

<设定>
{{config}}

<设定>
{{config}}
</设定>`,

    vars: ["chapterNumber", "wordsPerChapter", "config", "synopsis", "characters", "continuity", "blueprint", "future", "summary", "previousEnding"],
  },

  /* ---------- 选中文本编辑 ---------- */
  edit_selected_text: {
    system: SYSTEM_CONTRACT,
    task: `对选中的小说片段执行操作：{{operation}}。要求：保持与上下文一致的人称、时态与文风{{styleHint}}。只输出改写后的文字，不要解释。

<选中的片段>
{{selection}}
</选中的片段>`,
    vars: ["operation", "selection", "styleHint"],
  },

  /* ---------- 审稿 ---------- */
  consistency_check: {
    system: SYSTEM_CONTRACT,
    task: `你是严格的责任编辑。请审阅本章草稿，从以下维度检查：1)与设定/世界观矛盾 2)人物性格或称谓不一致 3)情节逻辑与因果 4)节奏与注水 5)文字质量与 AI 腔。输出 JSON 数组（没有问题就输出 []），每条：
[{"severity":"high|medium|low","dimension":"维度","quote":"原文摘录(20字内)","comment":"问题与修改建议 40-120字"}]

<作品设定>
{{config}}
</作品设定>

<本章蓝图>
{{blueprint}}
</本章蓝图>

<前情摘要>
{{summary}}
</前情摘要>

<章节草稿>
{{draft}}
</章节草稿>`,
    vars: ["config", "blueprint", "summary", "draft"],
  },

  /* ---------- 审稿（四维结构化，对应桌面版 reviewDimensions） ---------- */
  review_chapter: {
    system: SYSTEM_CONTRACT,
    task: `你是严格的责任编辑。只从以下四个维度审阅本章草稿：
1. 剧情连贯性 —— 与前面章节、已定稿事实是否接得上
2. 剧情合理性 —— 因果链、人物动机、逻辑是否成立
3. 角色状态 —— 位置、伤势、持有物品、心理状态是否与前文一致
4. 前后章节串联 —— 是否接住上一章的钩子、是否为下一章留好接口

输出 JSON 数组（确实没有问题时输出 []），每条：
[{"dimension":"剧情连贯性|剧情合理性|角色状态|前后章节串联","severity":"high|medium|low","quote":"原文摘录(20字内)","comment":"问题与具体修改建议 40-120字"}]

<作品设定>
{{config}}
</作品设定>

<已定稿事实>
{{facts}}
</已定稿事实>
